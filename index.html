  Panel: "\u003c!DOCTYPE html> \n\u003chtml> \n\u003chead> \n\u003cbase target=\"_top\"> \n\u003cmeta charset=\"utf-8\"> \n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> \u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js\">\u003c/script> \n\u003cscript src=\"https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js\">\u003c/script> \u003cstyle> \n \n:root{--m:#001B48;--a:#02457A;--b:#018ABE;--c:#97CADB;--d:#D6E8EE;--crema:#EEE5C2;--am:#FAD564;--lima:#D3DC7C;--verde:#8EBD9D;--t:#1B475D;--fondo:#F3F8FA} \n  *{box-sizing:border-box} \n  [hidden]{display:none!important} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--m)} \n  h1{margin:0 0 16px;font-size:24px} \n  h2{margin:0 0 12px;font-size:17px;color:var(--a)} \n  label{display:block;font-size:13px;margin:10px 0 4px;color:var(--t)} \n  input,select{width:100%;padding:11px;border:1.5px solid var(--c);border-radius:10px;font-size:15px;background:#fff} \n  input:focus{outline:none;border-color:var(--b)} \n  button,a.btn{border:0;border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer;background:var(--a);color:#fff;text-decoration:none;display:inline-block} \n  button:disabled{background:#E3E8EE;color:#8A97AD;cursor:not-allowed} \n  button.sec{background:var(--d);color:var(--a)} \n  button.am{background:var(--am);color:var(--m);font-weight:bold} \n  button.pri{background:var(--m)} \n  button.verde{background:var(--verde);color:var(--m);font-weight:bold} \n  button.peq-b{padding:7px 12px;font-size:13px} \n  a.wa{background:var(--verde);color:var(--m);font-weight:bold} \n  .msg{margin:8px 0;font-size:14px;min-height:18px} \n  .peq{font-size:13px;color:var(--t);margin:4px 0 8px} \n  .nota{font-size:12px;color:var(--t);margin:10px 0 0} \n  .acc{display:flex;flex-wrap:wrap;gap:8px;align-items:center} \n \n.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,27,72,.10)} \n \n  /* Acceso */ \n \n#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--m) 0%,var(--a) 55%,var(--d) 55%)} \n \n.logbox{background:#fff;border-radius:20px;padding:26px;width:100%;max-width:380px;text-align:center;box-shadow:0 8px 24px rgba(0,27,72,.25)} \n  .logbox .logo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 3px 10px rgba(0,27,72,.25)} \n  .logbox h1{margin:10px 0 2px;font-size:26px} \n  .logbox h1 span,.marca b span{color:var(--b)} \n  .logbox .sub{font-size:14px;color:var(--t);margin:0 0 16px} \n  .logbox label,.logbox h2{text-align:left} \n  .logbox button{width:100%;margin-top:14px} \n \n.enlace{display:inline-block;margin-top:14px;font-size:14px;color:var(--a)} \n \n  /* Estructura */ \n  #app{display:grid;grid-template-columns:240px 1fr;min-height:100vh} \n  .side{background:var(--m);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column} \n  .marca{display:flex;align-items:center;gap:10px;padding:4px 8px 18px} \n  .marca img{width:40px;height:40px;border-radius:50%;object-fit:cover} \n  .marca b{font-size:20px;color:#fff} \n  .marca b span{color:var(--am)} \n  .nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:var(--d);padding:12px;margin-bottom:4px;border-radius:10px} \n  .nav button.on{background:var(--a);color:#fff;box-shadow:inset 4px 0 0 var(--am)} \n \n.badge{background:var(--am);color:var(--m);border-radius:20px;padding:1px8px;font-size:12px;font-weight:bold;margin-left:auto} \n  .usuario{margin-top:auto;font-size:14px;padding:10px 8px} \n  .usuario small{display:block;color:var(--c);margin:2px 0 10px} \n  .cont{padding:24px;min-width:0} \n  @media (max-width:860px){ \n    #app{grid-template-columns:1fr} \n    .side{position:static;height:auto} \n    .nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px} \n    .nav button{width:auto;white-space:nowrap} \n    .usuario{display:none} \n    .cont{padding:16px} \n  } \n \n  /* Tablas */ \n  .scroll{overflow-x:auto} \n \n.tabla{width:100%;border-collapse:collapse;font-size:14px;min-width:560px} \n  .tabla th{text-align:left;font-size:12px;color:var(--t);padding:10px;border-bottom:2px solid var(--d);white-space:nowrap} \n  .tabla td{padding:12px 10px;border-bottom:1px solid #E4EEF2;vertical-align:middle} \n  .chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:bold;white-space:nowrap} \n  .c-sin{background:#E3E8EE;color:#4A5B76} \n  .c-activo{background:var(--d);color:var(--a)} \n  .c-demora{background:var(--am);color:#5C4300} \n  .c-ok{background:#CFE6DA;color:var(--t)} \n  /* Indicadores */ \n \n.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px} \n  @media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}} \n  .kpi{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,27,72,.10);border-top:5px solid var(--c)} \n  .kpi b{display:block;font-size:30px} \n  .kpi span{font-size:13px;color:var(--t)} \n  .kpi.k-dem{border-top-color:var(--am)} .kpi.k-ok{border-top-color:var(--verde)} .kpi.k-act{border-top-color:var(--b)} .kpi.k-sin{border-top-color:#C5CEDB} \n \n  .barra{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap} \n  .barra input{flex:1;min-width:180px} \n  .grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px} \n  @media (max-width:860px){.grid2{grid-template-columns:1fr}} \n  .fila{display:grid;grid-template-columns:1fr 1fr;gap:10px} \n \n  /* Alertas */ \n  .alerta{border-left:6px solid var(--am)} \n  .pasos{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0} \n  .paso{padding:5px 10px;border-radius:20px;font-size:12px;background:#E3E8EE;color:#4A5B76} \n  .paso.on{background:var(--am);color:#5C4300;font-weight:bold} \n \n  /* Ventanas */ .modal{position:fixed;inset:0;background:rgba(0,27,72,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10} \n  .modal .card{max-width:360px;width:100%;margin:0;max-height:92vh;overflow:auto} \n  #qrBox{display:inline-block;background:#fff;padding:14px;border:1.5px solid var(--d);border-radius:12px} \n  #qrUrl{word-break:break-all;font-size:11px;color:var(--t);margin:10px 0} \n  .dato{padding:7px 0;border-bottom:1px solid var(--d);font-size:15px} \n  .dato span{display:block;font-size:12px;color:var(--t)} \n\u003c/style> \n\u003c/head> \n\u003cbody> \n \n\u003c!-- ACCESO --> \n\u003cdiv id=\"login\"> \n  \u003cdiv class=\"logbox\"> \n    \u003cimg class=\"logo\" id=\"logoL\" src=\"\u003c?!= incluir_('Logo') ?>\" alt=\"SafeStep\"> \n    \u003ch1>Safe\u003cspan>Step\u003c/span>\u003c/h1> \n    \u003cp class=\"sub\">Panel del colegio para registrar salidas y consultar recorridos.\u003c/p> \n    \u003ch2>Acceso del personal\u003c/h2> \n    \u003cp class=\"peq\" style=\"text-align:left\">Solo para personal autorizado del colegio.\u003c/p> \n    \u003clabel>Clave de administrador\u003c/label> \n    \u003cinput type=\"password\" id=\"clave\" onkeydown=\"if(event.key==='Enter')entrar()\"> \n    \u003cbutton class=\"pri\" onclick=\"entrar()\">Entrar\u003c/button> \n    \u003cdiv class=\"msg\" id=\"msgLogin\">\u003c/div> \n    \u003ca class=\"enlace\" href=\"\u003c?!= base ?>\" target=\"_top\">&lsaquo; Volver al inicio\u003c/a> \n  \u003c/div> \n\u003c/div> \n \n\u003c!-- APLICACIÓN --> \n\u003cdiv id=\"app\" hidden> \n  \u003caside class=\"side\"> \n    \u003cdiv class=\"marca\">\u003cimg id=\"logoS\" alt=\"\">\u003cb>Safe\u003cspan>Step\u003c/span>\u003c/b>\u003c/div> \n    \u003cnav class=\"nav\" id=\"nav\"> \n      \u003cbutton data-s=\"hoy\" class=\"on\" onclick=\"ir('hoy')\">&#9638; Recorridos de hoy\u003c/button> \n      \u003cbutton data-s=\"estudiantes\" onclick=\"ir('estudiantes')\">&#9786; Estudiantes\u003c/button> \n      \u003cbutton data-s=\"pulseras\" onclick=\"ir('pulseras')\">&#9635; Pulseras QR\u003c/button> \n      \u003cbutton data-s=\"horarios\" onclick=\"ir('horarios')\">&#9719; Horarios y plazos\u003c/button> \n      \u003cbutton data-s=\"cambios\" onclick=\"ir('cambios')\">&#8801; Historial de cambios\u003c/button> \n      \u003cbutton data-s=\"alertas\" onclick=\"ir('alertas')\">&#9650; Alertas por demora \u003cspan class=\"badge\" id=\"bAlertas\" hidden>0\u003c/span>\u003c/button> \n    \u003c/nav> \n    \u003cdiv class=\"usuario\">Administrador\u003csmall>Personal autorizado\u003c/small> \n      \u003cbutton class=\"sec peq-b\" onclick=\"location.reload()\">Cerrar sesión\u003c/button>\u003c/div> \n  \u003c/aside> \n \n  \u003cmain class=\"cont\"> \n \n    \u003c!-- RECORRIDOS DE HOY --> \n    \u003csection id=\"s-hoy\"> \n      \u003ch1>Recorridos de hoy\u003c/h1> \n      \u003cdiv class=\"kpis\" id=\"kpis\">\u003c/div> \n \n      \u003cdiv class=\"card\"> \n        \u003ch2>Registrar salida o llegada con QR o DNI\u003c/h2> \n        \u003cbutton class=\"am\" onclick=\"abrirScanner()\">Escanear pulsera\u003c/button> \n        \u003cdiv id=\"scanner\" hidden> \n          \u003cvideo id=\"video\" playsinline muted style=\"width:100%;max-width:420px;border-radius:12px;margin-top:12px;background:#000\">\u003c/video> \n          \u003cdiv id=\"fotoBox\" hidden> \n            \u003clabel>Toma una foto del QR\u003c/label> \n            \u003cinput type=\"file\" id=\"foto\" accept=\"image/*\" capture=\"environment\" onchange=\"leerFoto(this)\"> \n          \u003c/div> \n          \u003ccanvas id=\"lienzo\" hidden>\u003c/canvas> \n          \u003cdiv style=\"margin-top:10px\">\u003cbutton class=\"sec\" onclick=\"cerrarScanner()\">Cerrar\u003c/button>\u003c/div> \n        \u003c/div> \n        \u003clabel for=\"dniSalida\">¿Sin pulsera? Usa el DNI del estudiante\u003c/label> \n        \u003cdiv class=\"acc\"> \n          \u003cinput id=\"dniSalida\" inputmode=\"numeric\" maxlength=\"8\" placeholder=\"DNI de 8 dígitos\" style=\"max-width:220px\" onkeydown=\"if(event.key==='Enter')registrarPorDni('salida')\"> \n          \u003cbutton class=\"am\" id=\"btnDniSalida\" onclick=\"registrarPorDni('salida')\">Registrar salida\u003c/button> \n          \u003cbutton class=\"verde\" id=\"btnDniLlegada\" onclick=\"registrarPorDni('llegada')\">Registrar llegada\u003c/button> \n        \u003c/div> \n        \u003cdiv class=\"msg\" id=\"msgScan\">\u003c/div> \n      \u003c/div> \n \n      \u003cdiv class=\"card\"> \n        \u003ch2>Recorridos \u003cbutton class=\"sec peq-b\" style=\"float:right\" onclick=\"cargarHoy()\">Actualizar\u003c/button>\u003c/h2> \n        \u003cdiv class=\"msg\" id=\"msgHoy\">\u003c/div> \n        \u003cdiv class=\"scroll\"> \n          \u003ctable class=\"tabla\"> \n \n\u003cthead>\u003ctr>\u003cth>Estudiante\u003c/th>\u003cth>Salida\u003c/th>\u003cth>Transcurrido\u003c/th>\u003cth>Plazo\u003c/th>\u003cth>Estado\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead> \n            \u003ctbody id=\"tbHoy\">\u003c/tbody> \n          \u003c/table> \n        \u003c/div> \n        \u003cp class=\"nota\">Plazo = tiempo estimado del estudiante + tolerancia. Se actualiza solo cada 30 segundos.\u003c/p> \n      \u003c/div> \n    \u003c/section> \n \n    \u003c!-- ESTUDIANTES --> \n    \u003csection id=\"s-estudiantes\" hidden> \n      \u003ch1>Estudiantes\u003c/h1> \n      \u003cdiv class=\"card\"> \n        \u003cdiv class=\"barra\"> \n          \u003cinput id=\"buscar\" placeholder=\"Buscar por nombre o DNI\" oninput=\"pintarEstudiantes()\"> \n          \u003cbutton class=\"am\" onclick=\"nuevoEstudiante()\">+ Nuevo estudiante\u003c/button> \n        \u003c/div> \n        \u003cdiv class=\"scroll\"> \n          \u003ctable class=\"tabla\"> \n            \u003cthead>\u003ctr>\u003cth>Estudiante\u003c/th>\u003cth>DNI\u003c/th>\u003cth>Pulsera QR\u003c/th>\u003cth>Estado\u003c/th>\u003cth>Tutor\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead> \n            \u003ctbody id=\"tbEst\">\u003c/tbody> \n          \u003c/table> \n        \u003c/div> \n        \u003cp class=\"nota\" id=\"cuenta\">\u003c/p> \n      \u003c/div> \n    \u003c/section> \n \n    \u003c!-- PERFIL --> \n    \u003csection id=\"s-perfil\" hidden> \n      \u003cbutton class=\"sec peq-b\" onclick=\"ir('estudiantes')\">&lsaquo; Estudiantes\u003c/button> \n      \u003ch1 style=\"margin-top:12px\" id=\"perfilTitulo\">Perfil de estudiante\u003c/h1> \n      \u003cdiv class=\"grid2\"> \n        \u003cdiv class=\"card\"> \n          \u003ch2>Datos del estudiante\u003c/h2> \n          \u003clabel>Nombre completo\u003c/label>\u003cinput id=\"pNombre\"> \n          \u003cdiv class=\"fila\"> \n            \u003cdiv>\u003clabel>Edad\u003c/label>\u003cinput id=\"pEdad\" type=\"number\" inputmode=\"numeric\">\u003c/div> \n            \u003cdiv>\u003clabel>Tiempo estimado (min)\u003c/label>\u003cinput id=\"pMin\" type=\"number\" inputmode=\"numeric\">\u003c/div> \n          \u003c/div> \n          \u003cdiv class=\"fila\"> \n            \u003cdiv>\u003clabel>DNI\u003c/label>\u003cinput id=\"pDni\" inputmode=\"numeric\">\u003c/div> \n            \u003cdiv>\u003clabel>Teléfono del tutor (sin +51)\u003c/label>\u003cinput id=\"pTel\" inputmode=\"numeric\">\u003c/div> \n          \u003c/div> \n          \u003clabel>Dirección\u003c/label>\u003cinput id=\"pDir\"> \n          \u003clabel>Hospital de referencia\u003c/label>\u003cinput id=\"pHosp\"> \n          \u003clabel>Alergias\u003c/label>\u003cinput id=\"pAler\" placeholder=\"Ninguna\"> \n          \u003clabel>Números de emergencia\u003c/label>\u003cinput id=\"pEmer\" placeholder=\"Ej: Policía 105 · Ambulancia 106 · Bomberos 116\"> \n          \u003cdiv id=\"cajaMotivo\">\u003clabel>Motivo del cambio (opcional)\u003c/label>\u003cinput id=\"pMotivo\">\u003c/div> \n          \u003cdiv style=\"margin-top:14px\">\u003cbutton class=\"pri\" onclick=\"guardarPerfil()\">Guardar cambios\u003c/button>\u003c/div> \n          \u003cdiv class=\"msg\" id=\"msgPerfil\">\u003c/div> \n        \u003c/div> \n        \u003cdiv class=\"card\" id=\"cajaPulsera\" hidden>\u003c/div> \n      \u003c/div> \n    \u003c/section> \n \n    \u003c!-- PULSERAS --> \n    \u003csection id=\"s-pulseras\" hidden> \n      \u003ch1>Pulseras QR\u003c/h1> \n      \u003cdiv class=\"card\"> \n        \u003cdiv class=\"barra\">\u003cbutton class=\"am\" onclick=\"nuevoEstudiante()\">+ Registrar estudiante y pulsera\u003c/button>\u003c/div> \n        \u003cdiv class=\"scroll\"> \n          \u003ctable class=\"tabla\"> \n \n\u003cthead>\u003ctr>\u003cth>ID\u003c/th>\u003cth>Estudiante\u003c/th>\u003cth>Estado\u003c/th>\u003cth>Acciones\u003c/th>\u003c/tr>\u003c/thead> \n            \u003ctbody id=\"tbPul\">\u003c/tbody> \n          \u003c/table> \n        \u003c/div> \n        \u003cp class=\"nota\">El QR contiene solo un identificador no predecible. No incluye DNI ni datos personales. Si una pulsera se pierde, se desactiva o se reemplaza por una nueva.\u003c/p> \n      \u003c/div> \n    \u003c/section> \n \n    \u003c!-- HORARIOS Y PLAZOS --> \n    \u003csection id=\"s-horarios\" hidden> \n      \u003ch1>Horarios y plazos\u003c/h1> \n      \u003cdiv class=\"grid2\" style=\"grid-template-columns:1fr 1fr\"> \n        \u003cdiv class=\"card\"> \n          \u003ch2>Horario del colegio (referencia)\u003c/h2> \n          \u003clabel>Lunes a jueves\u003c/label>\u003cinput id=\"hLJ\" placeholder=\"Ej: 3:15 p. m.\"> \n          \u003clabel>Viernes\u003c/label>\u003cinput id=\"hVie\" placeholder=\"Ej: 1:00 p. m.\"> \n          \u003cp class=\"nota\">Solo referencia: el tiempo empieza cuando se registra la salida real.\u003c/p> \n          \u003cdiv style=\"margin-top:12px\">\u003cbutton class=\"pri\" onclick=\"guardarHorario()\">Guardar cambio\u003c/button>\u003c/div> \n        \u003c/div> \n        \u003cdiv class=\"card\"> \n          \u003ch2>Tiempos y plazos\u003c/h2> \n          \u003clabel>Tolerancia antes del protocolo (min)\u003c/label>\u003cinput id=\"hTol\" type=\"number\" inputmode=\"numeric\"> \n          \u003clabel>Tiempo estimado para todos los estudiantes (min)\u003c/label> \n          \u003cinput id=\"hMin\" type=\"number\" inputmode=\"numeric\" placeholder=\"Déjalo vacío para no cambiarlo\"> \n          \u003cp class=\"nota\">El tiempo de cada estudiante también se edita en su perfil. Plazo = tiempo estimado + tolerancia.\u003c/p> \n          \u003cdiv style=\"margin-top:12px\">\u003cbutton class=\"pri\" onclick=\"guardarTiempos()\">Guardar tiempos\u003c/button>\u003c/div> \n        \u003c/div> \n      \u003c/div> \n      \u003cdiv class=\"msg\" id=\"msgHor\">\u003c/div> \n      \u003cdiv class=\"card\">\u003ch2>Excepción temporal\u003c/h2>\u003cp class=\"peq\">Las excepciones de horario con caducidad automática llegarán en una próxima etapa.\u003c/p>\u003c/div> \n    \u003c/section> \n \n    \u003c!-- HISTORIAL DE CAMBIOS --> \n    \u003csection id=\"s-cambios\" hidden> \n      \u003ch1>Historial de cambios\u003c/h1> \n      \u003cdiv class=\"card\"> \n        \u003cdiv class=\"scroll\"> \n          \u003ctable class=\"tabla\"> \n            \u003cthead>\u003ctr>\u003cth>Fecha y hora\u003c/th>\u003cth>Qué cambió\u003c/th>\u003cth>Detalle\u003c/th>\u003cth>Motivo\u003c/th>\u003cth>Responsable\u003c/th>\u003cth>Tipo\u003c/th>\u003c/tr>\u003c/thead> \n            \u003ctbody id=\"tbCam\">\u003c/tbody> \n          \u003c/table> \n        \u003c/div> \n        \u003cp class=\"nota\">Cada cambio guarda motivo, responsable y hora. Se muestran los 50 más recientes.\u003c/p> \n      \u003c/div> \n    \u003c/section> \n \n    \u003c!-- ALERTAS POR DEMORA --> \n    \u003csection id=\"s-alertas\" hidden> \n      \u003ch1>Alertas por demora\u003c/h1> \n      \u003cdiv id=\"listaAlertas\">\u003c/div> \n      \u003cp class=\"nota\">Una demora es una señal de atención, no una prueba de peligro. Las etapas cuentan desde que vence el plazo.\u003c/p> \n    \u003c/section> \n \n  \u003c/main> \n\u003c/div> \n \n\u003c!-- VENTANA: QR --> \n\u003cdiv id=\"mQR\" class=\"modal\" hidden> \n  \u003cdiv class=\"card\" style=\"text-align:center\"> \n    \u003ch2 id=\"qrNombre\">\u003c/h2> \n    \u003cdiv id=\"qrBox\">\u003c/div> \n    \u003cdiv id=\"qrUrl\">\u003c/div> \n    \u003cdiv class=\"peq\">\u003ca id=\"qrLink\" href=\"#\" target=\"_blank\">Abrir esta ficha (para probar sin escanear)\u003c/a>\u003c/div> \n    \u003cdiv class=\"acc\" style=\"justify-content:center\"> \n      \u003cbutton onclick=\"descargar()\">Descargar PNG\u003c/button> \n      \u003cbutton class=\"sec\" onclick=\"$('mQR').hidden=true\">Cerrar\u003c/button> \n    \u003c/div> \n    \u003cdiv class=\"peq\">Si no descarga, mantén presionado el QR y guarda la imagen.\u003c/div> \n  \u003c/div> \n\u003c/div> \n \n\u003c!-- VENTANA: MOTIVO --> \n\u003cdiv id=\"mMotivo\" class=\"modal\" hidden> \n  \u003cdiv class=\"card\"> \n    \u003ch2 id=\"mmTitulo\">\u003c/h2> \n    \u003clabel>Motivo\u003c/label> \n    \u003cinput id=\"mmTexto\" placeholder=\"Ej: Ajuste anual, extravío…\"> \n    \u003cdiv class=\"acc\" style=\"margin-top:14px\"> \n      \u003cbutton class=\"pri\" onclick=\"mmOk()\">Confirmar\u003c/button> \n      \u003cbutton class=\"sec\" onclick=\"$('mMotivo').hidden=true\">Cancelar\u003c/button> \n    \u003c/div> \n  \u003c/div> \n\u003c/div> \n\u003c!-- VENTANA: FICHA DE BÚSQUEDA --> \n\u003cdiv id=\"mFicha\" class=\"modal\" hidden> \n  \u003cdiv class=\"card\"> \n    \u003ch2>Ficha de búsqueda\u003c/h2> \n    \u003cdiv class=\"peq\">Solo familia y colegio\u003c/div> \n    \u003cdiv id=\"fichaCuerpo\">\u003c/div> \n    \u003cdiv class=\"peq\">Es el último dato que la app conoce: no sabe dónde está ahora.\u003c/div> \n    \u003cdiv class=\"acc\" style=\"margin-top:8px\"> \n      \u003ca class=\"btn wa\" id=\"fichaWA\" target=\"_blank\" href=\"#\">Compartir por WhatsApp\u003c/a> \n      \u003cbutton class=\"sec\" onclick=\"$('mFicha').hidden=true\">Cerrar\u003c/button> \n    \u003c/div> \n  \u003c/div> \n\u003c/div> \n \n\u003cscript> \n  var CLAVE = '', HOY = null, EST = [], DESFASE = 0, SECCION = 'hoy', PERFIL = null, ACCION = null, QR_NOMBRE = ''; \n  function $(id){ return document.getElementById(id); } \n  function esc(s){ return String(s == null ? '' : s).replace(/[&\u003c>\"']/g, function(c){ return {'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]; }); } \n  function falla(id){ return function(e){ $(id).textContent = e.message; }; } \n \n  var CHIPS = { \n    sin: ['c-sin', '\\u25CB Sin salida'], \n    activo: ['c-activo', '\\u25D4 Recorrido activo'], \n    declarada: ['c-activo', '\\u25D4 Llegada declarada'], \n    demora: ['c-demora', '\\u25B2 Demora'], \n    confirmada: ['c-ok', '\\u2714 Llegada confirmada'] \n  }; \n  var PUL = { \n    activa: ['c-ok', '\\u2714 Activa'], \n    perdida: ['c-demora', '\\u25B2 Perdida'], \n    revocada: ['c-sin', '\\u25CB Desactivada'] \n  }; \n  function chip(tabla, k){ var c = tabla[k] || ['c-sin', k]; return '\u003cspan class=\"chip ' + c[0] + '\">' + c[1] + '\u003c/span>'; } \n \n  // ---------- Acceso y navegación ---------- \n  function entrar(){ \n    CLAVE = $('clave').value; \n    $('msgLogin').textContent = 'Verificando…'; \n    google.script.run \n      .withSuccessHandler(function(r){ \n        $('login').hidden = true; $('app').hidden = false; \n        $('logoS').src = $('logoL').src; \n        aplicarHoy(r); \n      }) \n      .withFailureHandler(falla('msgLogin')) \n      .panelResumenHoy(CLAVE); \n  } \n \n  function ir(s){ \n    SECCION = s; \n \n['hoy','estudiantes','perfil','pulseras','horarios','cambios','alertas'].forEach(function(x){ $('s-' + x).hidden = (x !== s); }); \n    var marca = (s === 'perfil') ? 'estudiantes' : s; \n    var bs = $('nav').querySelectorAll('button'); \n    for (var i = 0; i \u003c bs.length; i++) bs[i].className = (bs[i].getAttribute('data-s') === marca) ? 'on' : ''; \n    if (s === 'hoy' || s === 'alertas') cargarHoy(); \n    if (s === 'estudiantes' || s === 'pulseras') cargarEstudiantes(); \n    if (s === 'horarios') cargarConfig(); \n    if (s === 'cambios') cargarCambios(); \n    window.scrollTo(0, 0); \n  } \n \n  function pedirMotivo(titulo, cb){ \n    ACCION = cb; \n    $('mmTitulo').textContent = titulo; \n    $('mmTexto').value = ''; \n    $('mMotivo').hidden = false; \n  } \n  function mmOk(){ \n    var m = $('mmTexto').value.trim(); \n    $('mMotivo').hidden = true; \n    if (ACCION) ACCION(m); \n  } \n \n  // ---------- Recorridos de hoy y alertas ---------- \n  function estadoDe(f, ahora){ \n    if (f.estado === 'en_camino') return ahora > f.limite_ms ? 'demora' : 'activo'; \n    if (f.estado === 'llegada_declarada') return 'declarada'; \n    if (f.estado === 'verificada') return 'confirmada'; \n    return 'sin'; \n  } \n \n  function cargarHoy(){ \n \ngoogle.script.run.withSuccessHandler(aplicarHoy).withFailureHandler(falla('msgHoy')).panelResumenHoy(CLAVE); \n  } \n \n  function aplicarHoy(r){ \n    HOY = r; \n    DESFASE = r.ahora - Date.now(); \n    renderHoy(); \n    renderAlertas(); \n  } \n \n  function renderHoy(){ \n    if (!HOY) return; \n    var ahora = Date.now() + DESFASE, tol = HOY.tolerancia; \n    var n = { sin: 0, act: 0, dem: 0, ok: 0 }; \n    var filas = HOY.filas.map(function(f, i){ \n      var e = estadoDe(f, ahora); \n      if (e === 'sin') n.sin++; else if (e === 'demora') n.dem++; else if (e === 'confirmada') n.ok++; else n.act++; \n      var trans = '—'; \n      if (f.salida_ms){ \n        var fin = (e === 'confirmada') ? f.verificada_ms : (e === 'declarada' ? f.declarada_ms : ahora); \n        trans = Math.max(0, Math.floor((fin - f.salida_ms) / 60000)) + ' min'; \n      } \n      var accion = ''; \n      if (e === 'sin') accion = '\u003cbutton class=\"am peq-b\" onclick=\"registrarSalida(' + i + ')\">Registrar salida\u003c/button>'; \n      if (e === 'demora') accion = '\u003cbutton class=\"sec peq-b\" onclick=\"ir(\\'alertas\\')\">Ver alerta\u003c/button>'; \n      return '\u003ctr>\u003ctd>\u003cb>' + esc(f.nombre) + '\u003c/b>\u003c/td>\u003ctd>' + (f.salida_hora || '—') + '\u003c/td>\u003ctd>' + trans + \n             '\u003c/td>\u003ctd>' + (f.minutos + tol) + ' min\u003c/td>\u003ctd>' + chip(CHIPS, e) + '\u003c/td>\u003ctd>' + accion + '\u003c/td>\u003c/tr>'; \n    }); \n    $('tbHoy').innerHTML = filas.length ? filas.join('') : '\u003ctr>\u003ctd colspan=\"6\">Aún no hay estudiantes registrados.\u003c/td>\u003c/tr>'; \n    $('kpis').innerHTML = \n      '\u003cdiv class=\"kpi k-sin\">\u003cb>' + n.sin + '\u003c/b>\u003cspan>\\u25CB Sin salida registrada\u003c/span>\u003c/div>' + \n      '\u003cdiv class=\"kpi k-act\">\u003cb>' + n.act + '\u003c/b>\u003cspan>\\u25D4 Recorridos activos\u003c/span>\u003c/div>' + \n      '\u003cdiv class=\"kpi k-dem\">\u003cb>' + n.dem + '\u003c/b>\u003cspan>\\u25B2 Con demora\u003c/span>\u003c/div>' + \n      '\u003cdiv class=\"kpi k-ok\">\u003cb>' + n.ok + '\u003c/b>\u003cspan>\\u2714 Llegadas confirmadas\u003c/span>\u003c/div>'; \n  } \n \n  function registrarSalida(i){ \n    $('msgHoy').textContent = 'Registrando salida…'; \n    google.script.run \n      .withSuccessHandler(function(r){ $('msgHoy').textContent = 'Salida registrada. Hora límite: ' + r.limite; cargarHoy(); }) \n      .withFailureHandler(falla('msgHoy')) \n      .panelRegistrarSalida(CLAVE, HOY.filas[i].id); \n  } \n \n  var ETAPAS = ['Plazo vencido', '+10 Familia', '+20 Colegio', '+30 Ruta habitual', '+40 Ficha']; \n  var TEXTOS = [ \n    'El plazo venció. Avisa a la familia.', \n    '+10 min: la familia intenta contactar al estudiante o a un adulto de confianza. Si llegó, marca «Ya llegó».', \n    '+20 min: aviso al colegio. Revisar cámaras.', \n    '+30 min: buscar por la ruta habitual; el colegio confirma si lo vio con alguien.', \n    '+40 min: la ficha de búsqueda está disponible.' \n  ]; \n \n  function renderAlertas(){ \n    if (!HOY) return; \n    var ahora = Date.now() + DESFASE, lista = []; \n    HOY.filas.forEach(function(f, i){ if (estadoDe(f, ahora) === 'demora') lista.push(i); }); \n    $('bAlertas').textContent = lista.length; \n    $('bAlertas').hidden = !lista.length; \n    if (!lista.length){ $('listaAlertas').innerHTML = '\u003cdiv class=\"card\">\\u2714 No hay demoras en este momento.\u003c/div>'; return; } \n    $('listaAlertas').innerHTML = lista.map(function(i){ \n      var f = HOY.filas[i]; \n      var m = Math.floor((ahora - f.limite_ms) / 60000); \n      var et = m >= 40 ? 4 : m >= 30 ? 3 : m >= 20 ? 2 : m >= 10 ? 1 : 0; \n      var pasos = ETAPAS.map(function(t, k){ return '\u003cspan class=\"paso ' + (k \u003c= et ? 'on' : '') + '\">' + t + '\u003c/span>'; }).join(''); \n      var texto = 'SafeStep: ' + f.nombre + ' aún no tiene la llegada confirmada (el plazo venció hace ' + m + \n                  ' min). Por favor intenta contactarlo o verifica con un adulto de confianza.'; \n      var wa = 'https://wa.me/' + HOY.prefijo + f.telefono + '?text=' + encodeURIComponent(texto); \n      return '\u003cdiv class=\"card alerta\">\u003ch2>\\u25B2 ' + esc(f.nombre) + ' · +' + m + ' min de demora\u003c/h2>' + \n        '\u003cdiv class=\"peq\">Salió ' + esc(f.salida_hora) + ' · plazo ' + (f.minutos + HOY.tolerancia) + ' min\u003c/div>' + \n        '\u003cdiv class=\"pasos\">' + pasos + '\u003c/div>\u003cp>' + TEXTOS[et] + '\u003c/p>' + \n        '\u003cdiv class=\"acc\">\u003ca class=\"btn wa\" target=\"_blank\" href=\"' + wa + '\">Avisar a la familia por WhatsApp\u003c/a>' + \n        '\u003cbutton class=\"sec\" onclick=\"verFicha(' + i + ')\"' + (et \u003c 4 ? ' disabled' : '') + '>Ver ficha de búsqueda\u003c/button>' + \n        '\u003cbutton class=\"verde\" onclick=\"yaLlego(' + i + ')\">Ya llegó\u003c/button>\u003c/div>' + \n        (et \u003c 4 ? '\u003cdiv class=\"peq\">La ficha de búsqueda se habilita a los +40 min.\u003c/div>' : '') + '\u003c/div>'; \n    }).join(''); \n  } \n \n  function yaLlego(i){ \n    google.script.run \n      .withSuccessHandler(cargarHoy) \n      .withFailureHandler(function(e){ alert(e.message); }) \n      .panelConfirmarLlegada(CLAVE, HOY.filas[i].id); \n  } \n \n  function verFicha(i){ \n    var f = HOY.filas[i]; \n    function d(l, v){ return '\u003cdiv class=\"dato\">\u003cspan>' + l + '\u003c/span>' + esc(v || '—') + '\u003c/div>'; } \n    $('fichaCuerpo').innerHTML = \n      '\u003ch2 style=\"margin-top:8px\">' + esc(f.nombre) + '\u003c/h2>' + \n      d('Edad', f.edad ? f.edad + ' años' : '') + d('DNI', f.dni) + \n      d('Último lugar registrado', 'Salida del colegio · ' + f.salida_hora) + \n      d('Contacto del tutor', f.telefono) + d('Alergias', f.alergias || 'Ninguna registrada') + \n      d('Hospital de referencia', f.hospital); \n    var texto = 'FICHA DE BÚSQUEDA — ' + f.nombre + (f.edad ? ', ' + f.edad + ' años' : '') + \n                '. Último lugar registrado: salida del colegio a las ' + f.salida_hora + \n                '. Contacto: ' + f.telefono + '. Alergias: ' + (f.alergias || 'ninguna registrada') + '.'; \n    $('fichaWA').href = 'https://wa.me/?text=' + encodeURIComponent(texto); \n    $('mFicha').hidden = false; \n  } \n \n  // ---------- Estudiantes ---------- \n  function cargarEstudiantes(){ \n    google.script.run \n      .withSuccessHandler(function(l){ EST = l; pintarEstudiantes(); pintarPulseras(); }) \n      .withFailureHandler(function(e){ $('cuenta').textContent = e.message; }) \n      .panelListarEstudiantes(CLAVE); \n  } \n \n  function pintarEstudiantes(){ \n    var q = $('buscar').value.trim().toLowerCase(); \n    var filas = []; \n    EST.forEach(function(e, i){ \n      if (q && e.nombre.toLowerCase().indexOf(q) \u003c 0 && String(e.dni_busqueda).indexOf(q) \u003c 0) return; \n      filas.push('\u003ctr>\u003ctd>\u003cb>' + esc(e.nombre) + '\u003c/b>\u003c/td>\u003ctd>' + esc(e.dni) + '\u003c/td>\u003ctd>' + esc(e.id) + \n        '\u003c/td>\u003ctd>' + chip(PUL, e.estado) + '\u003c/td>\u003ctd>' + esc(e.telefono) + \n        '\u003c/td>\u003ctd>\u003cbutton class=\"sec peq-b\" onclick=\"abrirPerfil(' + i + ')\">Ver perfil\u003c/button>\u003c/td>\u003c/tr>'); \n    }); \n    $('tbEst').innerHTML = filas.length ? filas.join('') : '\u003ctr>\u003ctd colspan=\"6\">No hay estudiantes para mostrar.\u003c/td>\u003c/tr>'; \n    $('cuenta').textContent = 'Mostrando ' + filas.length + ' de ' + EST.length + ' estudiantes.'; \n  } \n \n  function limpiarPerfil(){ \n \n['pNombre','pEdad','pMin','pDni','pTel','pDir','pHosp','pAler','pEmer','pMotivo'].forEach(function(k){ $(k).value = ''; }); \n    $('msgPerfil').textContent = ''; \n  } \n \n  function nuevoEstudiante(){ \n    PERFIL = null; limpiarPerfil(); \n    $('perfilTitulo').textContent = 'Nuevo estudiante'; \n    $('cajaMotivo').hidden = true; \n    $('cajaPulsera').hidden = true; \n    ir('perfil'); \n  } \n \n  function abrirPerfil(i){ \n    limpiarPerfil(); \n    $('msgPerfil').textContent = 'Cargando…'; \n    ir('perfil'); \n    google.script.run \n      .withSuccessHandler(function(p){ \n        PERFIL = p; \n        $('perfilTitulo').textContent = 'Perfil de ' + p.nombre; \n        $('pNombre').value = p.nombre; $('pEdad').value = p.edad; $('pMin').value = p.minutos; \n        $('pDni').value = p.dni; $('pTel').value = p.telefono; $('pDir').value = p.direccion; \n        $('pHosp').value = p.hospital; $('pAler').value = p.alergias; $('pEmer').value = p.emergencia; \n        $('cajaMotivo').hidden = false; \n        $('msgPerfil').textContent = ''; \n        pintarCajaPulsera(); \n      }) \n      .withFailureHandler(falla('msgPerfil')) \n      .panelObtenerEstudiante(CLAVE, EST[i].id); \n  } \n \n  function pintarCajaPulsera(){ \n    var p = PERFIL; \n    var botones = '\u003cbutton onclick=\"verQRdesde(\\'' + esc(p.id) + '\\')\">Ver QR\u003c/button>' + \n      '\u003cbutton class=\"sec\" onclick=\"accionPulsera(\\'' + esc(p.id) + '\\',\\'reemplazar\\')\">Reemplazar\u003c/button>' + \n      (p.estado === 'activa' \n        ? '\u003cbutton class=\"sec\" onclick=\"accionPulsera(\\'' + esc(p.id) + '\\',\\'desactivar\\')\">Desactivar\u003c/button>' \n        : '\u003cbutton class=\"sec\" onclick=\"accionPulsera(\\'' + esc(p.id) + '\\',\\'activar\\')\">Activar\u003c/button>'); \n    $('cajaPulsera').innerHTML = '\u003ch2>Pulsera QR\u003c/h2>\u003cdiv class=\"dato\">\u003cspan>ID\u003c/span>' + esc(p.id) + '\u003c/div>' + \n      '\u003cdiv class=\"dato\">\u003cspan>Estado\u003c/span>' + chip(PUL, p.estado) + '\u003c/div>' + \n      '\u003cdiv class=\"dato\">\u003cspan>ID personal del apoderado\u003c/span>\u003cb>' + esc(p.id_personal) + '\u003c/b>\u003c/div>' + \n      '\u003cp class=\"nota\">Identificador aleatorio: no contiene DNI.\u003c/p>\u003cdiv class=\"acc\" style=\"margin-top:10px\">' + botones + '\u003c/div>' + \n      '\u003cdiv class=\"msg\" id=\"msgPul\">\u003c/div>'; \n    $('cajaPulsera').hidden = false; \n  } \n \n  function guardarPerfil(){ \n    var d = { \n      nombre: $('pNombre').value, edad: $('pEdad').value, minutos_promedio: $('pMin').value, \n      dni: $('pDni').value, telefono_tutor: $('pTel').value, direccion: $('pDir').value, \n      hospital_referencia: $('pHosp').value, alergias: $('pAler').value, numeros_emergencia: $('pEmer').value \n    }; \n    $('msgPerfil').textContent = 'Guardando…'; \n    if (!PERFIL){ \n      google.script.run \n        .withSuccessHandler(function(r){ \n          $('msgPerfil').textContent = 'Listo: ' + r.id + ' · ID personal para el apoderado: ' + r.id_personal; \n          limpiarPerfil(); \n          $('msgPerfil').textContent = 'Registrado: ' + r.id + ' · ID personal para el apoderado: ' + r.id_personal; \n        }) \n        .withFailureHandler(falla('msgPerfil')) \n        .panelRegistrarEstudiante(CLAVE, d); \n    } else { \n      google.script.run \n        .withSuccessHandler(function(){ $('msgPerfil').textContent = 'Cambios guardados.'; $('pMotivo').value = ''; }) \n        .withFailureHandler(falla('msgPerfil')) \n        .panelActualizarEstudiante(CLAVE, PERFIL.id, d, $('pMotivo').value.trim()); \n    } \n  } \n \n  // ---------- Pulseras ---------- \n  function pintarPulseras(){ \n    var filas = EST.map(function(e, i){ \n      return '\u003ctr>\u003ctd>\u003cb>' + esc(e.id) + '\u003c/b>\u003c/td>\u003ctd>' + esc(e.nombre) + '\u003c/td>\u003ctd>' + chip(PUL, e.estado) + \n        '\u003c/td>\u003ctd>\u003cdiv class=\"acc\">\u003cbutton class=\"peq-b\" onclick=\"verQR(' + i + ')\">Ver QR\u003c/button>' + \n        '\u003cbutton class=\"sec peq-b\" onclick=\"accionPulsera(\\'' + esc(e.id) + '\\',\\'reemplazar\\')\">Reemplazar\u003c/button>' + \n        (e.estado === 'activa' \n          ? '\u003cbutton class=\"sec peq-b\" onclick=\"accionPulsera(\\'' + esc(e.id) + '\\',\\'desactivar\\')\">Desactivar\u003c/button>' \n          : '\u003cbutton class=\"sec peq-b\" onclick=\"accionPulsera(\\'' + esc(e.id) + '\\',\\'activar\\')\">Activar\u003c/button>') + \n        '\u003c/div>\u003c/td>\u003c/tr>'; \n    }); \n    $('tbPul').innerHTML = filas.length ? filas.join('') : '\u003ctr>\u003ctd colspan=\"4\">Aún no hay pulseras.\u003c/td>\u003c/tr>'; \n  } \n \n  function accionPulsera(id, tipo){ \n    var titulos = { reemplazar: 'Reemplazar pulsera: el QR anterior dejará de funcionar', desactivar: 'Desactivar pulsera', activar: 'Activar pulsera' }; \n    pedirMotivo(titulos[tipo], function(motivo){ \n      var ok = function(){ \n        if (PERFIL && PERFIL.id === id && !$('s-perfil').hidden){ abrirPerfilPorId(id); } \n        cargarEstudiantes(); \n      }; \n      var mal = function(e){ alert(e.message); }; \n      if (tipo === 'reemplazar') google.script.run.withSuccessHandler(ok).withFailureHandler(mal).panelNuevaPulsera(CLAVE, id, motivo); \n      if (tipo === 'desactivar') google.script.run.withSuccessHandler(ok).withFailureHandler(mal).panelCambiarEstado(CLAVE, id, 'revocada', motivo); \n      if (tipo === 'activar') google.script.run.withSuccessHandler(ok).withFailureHandler(mal).panelCambiarEstado(CLAVE, id, 'activa', motivo); \n    }); \n  } \n \n  function abrirPerfilPorId(id){ \n    google.script.run.withSuccessHandler(function(p){ PERFIL = p; pintarCajaPulsera(); }).panelObtenerEstudiante(CLAVE, id); \n  } \n \n  function mostrarQR(nombre, url){ \n    QR_NOMBRE = nombre; \n    $('qrNombre').textContent = nombre; \n    $('qrBox').innerHTML = ''; \n    new QRCode($('qrBox'), { text: url, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M }); \n    $('qrUrl').textContent = url.indexOf('/dev') > -1 \n      ? 'ATENCIÓN: esta es la URL de prueba (/dev). Publica la implementación antes de imprimir.' \n      : url; \n    $('qrLink').href = url; \n    $('mQR').hidden = false; \n  } \n  function verQR(i){ mostrarQR(EST[i].nombre, EST[i].qr); } \n  function verQRdesde(){ mostrarQR(PERFIL.nombre, PERFIL.qr); } \n \n  function descargar(){ \n    var cv = $('qrBox').querySelector('canvas'); \n    var a = document.createElement('a'); \n    a.href = cv.toDataURL('image/png'); \n    a.download = 'QR-' + QR_NOMBRE + '.png'; \n    a.click(); \n  } \n \n  // ---------- Horarios y plazos ---------- \n  function cargarConfig(){ \n    google.script.run \n      .withSuccessHandler(function(c){ $('hLJ').value = c.horario_lj; $('hVie').value = c.horario_vie; $('hTol').value = c.tolerancia_min; }) \n      .withFailureHandler(falla('msgHor')) \n      .panelLeerConfig(CLAVE); \n  } \n \n  function guardarHorario(){ \n    pedirMotivo('Motivo del cambio de horario', function(m){ \n      google.script.run \n        .withSuccessHandler(function(){ $('msgHor').textContent = 'Horario guardado.'; }) \n        .withFailureHandler(falla('msgHor')) \n        .panelGuardarConfig(CLAVE, { horario_lj: $('hLJ').value, horario_vie: $('hVie').value }, m); \n    }); \n  } \n \n  function guardarTiempos(){ \n    pedirMotivo('Motivo del cambio de tiempos', function(m){ \n      var mins = $('hMin').value; \n      google.script.run \n        .withSuccessHandler(function(){ \n          if (mins){ \n            google.script.run \n              .withSuccessHandler(function(n){ $('msgHor').textContent = 'Tolerancia guardada y tiempo estimado aplicado a ' + n + ' estudiantes.'; $('hMin').value = ''; }) \n              .withFailureHandler(falla('msgHor')) \n              .panelAplicarMinutos(CLAVE, mins, m); \n          } else { $('msgHor').textContent = 'Tolerancia guardada.'; } \n        }) \n        .withFailureHandler(falla('msgHor')) \n        .panelGuardarConfig(CLAVE, { tolerancia_min: $('hTol').value }, m); \n    }); \n  } \n \n  // ---------- Historial de cambios ---------- \n  function cargarCambios(){ \n    google.script.run \n      .withSuccessHandler(function(l){ \n        $('tbCam').innerHTML = l.length ? l.map(function(c){ \n          return '\u003ctr>\u003ctd>' + esc(c.fecha) + '\u003c/td>\u003ctd>\u003cb>' + esc(c.que) + '\u003c/b>\u003c/td>\u003ctd>' + esc(c.detalle) + \n                 '\u003c/td>\u003ctd>' + esc(c.motivo || '—') + '\u003c/td>\u003ctd>' + esc(c.responsable) + '\u003c/td>\u003ctd>' + esc(c.tipo) + '\u003c/td>\u003c/tr>'; \n        }).join('') : '\u003ctr>\u003ctd colspan=\"6\">Aún no hay cambios registrados.\u003c/td>\u003c/tr>'; \n      }) \n      .withFailureHandler(function(e){ $('tbCam').innerHTML = '\u003ctr>\u003ctd colspan=\"6\">' + esc(e.message) + '\u003c/td>\u003c/tr>'; }) \n      .panelListarCambios(CLAVE); \n  } \n \n  // ---------- Escáner de QR (registrar salida) ---------- \n  var STREAM = null, ESCANEANDO = false; \n \n  function abrirScanner(){ \n    detenerCamara(); \n    $('scanner').hidden = false; \n    $('msgScan').textContent = 'Abriendo cámara…'; \n    $('fotoBox').hidden = true; \n    $('video').hidden = false; \n    pedirCamara() \n      .then(function(s){ \n        STREAM = s; \n        var v = $('video'); \n        v.srcObject = s; \n        var pl = v.play(); if (pl && pl.catch) pl.catch(function(){}); \n        ESCANEANDO = true; \n        $('msgScan').textContent = 'Apunta al QR de la pulsera'; \n        requestAnimationFrame(leerCuadro); \n      }) \n      .catch(function(err){ modoFoto(msgCamara(err)); }); \n  } \n \n  /* ---------- Cámara: apertura robusta y lectura de QR ---------- */ \n  var DETECTOR = null; \n  try { if ('BarcodeDetector' in window) DETECTOR = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { DETECTOR = null; } \n \n  function pedirCamara(){ \n    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ \n      return Promise.reject({ name: 'SinApi' }); \n    } \n    var intentos = [ \n      { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }, \n      { video: true, audio: false } \n    ]; \n    function probar(i){ \n      return navigator.mediaDevices.getUserMedia(intentos[i]).catch(function(e){ \n        if (i + 1 \u003c intentos.length && e && e.name !== 'NotAllowedError' && e.name !== 'SecurityError'){ return probar(i + 1); } \n        throw e; \n      }); \n    } \n    return probar(0); \n  } \n \n  function msgCamara(e){ \n    var n = (e && e.name) || ''; \n    if (n === 'SinApi') return 'Este navegador no permite usar la cámara aquí. Abre el enlace en Chrome o Safari (no desde WhatsApp ni Instagram).'; \n    if (n === 'NotAllowedError' || n === 'SecurityError') return 'La cámara está bloqueada. Toca el candado junto a la dirección, permite la cámara y vuelve a intentar.'; \n    if (n === 'NotFoundError' || n === 'DevicesNotFoundError') return 'No se encontró ninguna cámara en este dispositivo.'; \n    if (n === 'NotReadableError' || n === 'TrackStartError') return 'La cámara la está usando otra aplicación. Ciérrala e intenta de nuevo.'; \n    return 'No se pudo abrir la cámara (' + (n || 'error desconocido') + ').'; \n  } \n \n  function leerCuadro(){ \n    if (!ESCANEANDO) return; \n    var v = $('video'); \n    if (v.readyState !== v.HAVE_ENOUGH_DATA){ requestAnimationFrame(leerCuadro); return; } \n    if (DETECTOR){ \n      DETECTOR.detect(v).then(function(r){ \n        if (!ESCANEANDO) return; \n        if (r && r.length && r[0].rawValue){ procesarQR(r[0].rawValue); } \n        else { requestAnimationFrame(leerCuadro); } \n      }).catch(function(){ DETECTOR = null; requestAnimationFrame(leerCuadro); }); \n      return; \n    } \n    if (typeof jsQR === 'undefined'){ modoFoto('No se cargó el lector de QR. Revisa tu conexión a internet.'); return; } \n    var c = $('lienzo'); \n    c.width = v.videoWidth; c.height = v.videoHeight; \n    var x = c.getContext('2d'); \n    x.drawImage(v, 0, 0, c.width, c.height); \n    var q = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'dontInvert' }); \n    if (q && q.data){ procesarQR(q.data); return; } \n    requestAnimationFrame(leerCuadro); \n  } \n \n  function modoFoto(motivo){ \n    detenerCamara(); \n    $('video').hidden = true; \n    $('fotoBox').hidden = false; \n    $('msgScan').textContent = (motivo || 'La cámara en vivo no está disponible aquí.') + ' Mientras tanto puedes tomar una foto del QR.'; \n  } \n \n  function leerFoto(input){ \n    var archivo = input.files && input.files[0]; \n    if (!archivo) return; \n    var img = new Image(); \n    img.onload = function(){ \n      var esc2 = Math.min(1, 1200 / Math.max(img.width, img.height)); \n      var c = $('lienzo'); \n      c.width = Math.round(img.width * esc2); c.height = Math.round(img.height * esc2); \n      var x = c.getContext('2d'); \n      x.drawImage(img, 0, 0, c.width, c.height); \n      var q = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height); \n      input.value = ''; \n      if (q && q.data){ procesarQR(q.data); } \n      else { $('msgScan').textContent = 'No se pudo leer el QR. Acércate y toma otra foto.'; } \n    }; \n    img.src = URL.createObjectURL(archivo); \n  } \n \n  function detenerCamara(){ \n    ESCANEANDO = false; \n    if (STREAM){ STREAM.getTracks().forEach(function(t){ t.stop(); }); STREAM = null; } \n  } \n \n  function cerrarScanner(){ detenerCamara(); $('scanner').hidden = true; } \n \n  function procesarQR(texto){ \n    var m = String(texto).match(/[?&]t=([a-fA-F0-9]+)/); \n    detenerCamara(); \n    if (!m){ $('msgScan').textContent = 'Este QR no es de SafeStep.'; return; } \n    $('msgScan').textContent = 'Registrando salida…'; \n    google.script.run \n      .withSuccessHandler(function(r){ \n        cerrarScanner(); \n        $('msgScan').textContent = 'Salida registrada: ' + r.nombre + ' · hora límite ' + r.limite; \n        cargarHoy(); \n      }) \n      .withFailureHandler(function(e){ cerrarScanner(); $('msgScan').textContent = e.message; }) \n      .panelSalidaPorQR(CLAVE, m[1]); \n  } \n \n  // ---------- Registrar salida o llegada con DNI ---------- \n  function registrarPorDni(tipo){ \n    var dni = $('dniSalida').value.replace(/\\D/g, ''); \n    if (dni.length \u003c 8){ $('msgScan').textContent = 'Escribe un DNI de 8 dígitos.'; return; } \n    var salida = tipo === 'salida'; \n    $('btnDniSalida').disabled = true; \n    $('btnDniLlegada').disabled = true; \n    $('msgScan').textContent = salida ? 'Registrando salida…' : 'Registrando llegada…'; \n    function fin(){ $('btnDniSalida').disabled = false; $('btnDniLlegada').disabled = false; } \n    var run = google.script.run \n      .withSuccessHandler(function(r){ \n        fin(); \n        $('dniSalida').value = ''; \n        $('msgScan').textContent = salida \n          ? 'Salida registrada: ' + r.nombre + ' · hora límite ' + r.limite \n          : 'Llegada confirmada: ' + r.nombre; \n        cargarHoy(); \n      }) \n      .withFailureHandler(function(e){ fin(); $('msgScan').textContent = e.message; }); \n    if (salida) run.panelSalidaPorDNI(CLAVE, dni); \n    else run.panelLlegadaPorDNI(CLAVE, dni); \n  } \n \n  // ---------- Actualización automática ---------- \n  setInterval(function(){ \n    if (!$('app').hidden && (SECCION === 'hoy' || SECCION === 'alertas')) cargarHoy(); \n  }, 30000); \n  setInterval(function(){ \n    if (HOY && !$('app').hidden){ renderHoy(); renderAlertas(); } \n  }, 15000); \n\u003c/script> \n\u003c/body> \n\u003c/html>\n",
  Publica: "\u003c!DOCTYPE html> \n\u003chtml> \n\u003chead> \n\u003cbase target=\"_top\"> \n\u003cmeta charset=\"utf-8\"> \n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> \n\u003cstyle> \n  :root{--m:#001B48;--a:#02457A;--d:#D6E8EE;--fondo:#F7F3E4;--t:#1B475D;--rojo:#8B3340;--rojo2:#E0606E} \n  *{box-sizing:border-box} \n  [hidden]{display:none!important} \n  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--m);min-height:100vh} \n  .rojo{background:var(--rojo);color:#fff;padding:30px 22px 78px;text-align:center} \n  .rojo .t{display:flex;align-items:center;justify-content:center;gap:12px} \n  .rojo h1{margin:0;font-size:30px} \n  .rojo p{margin:14px auto 0;max-width:340px;font-size:16px;line-height:1.4;opacity:.95} \n  .rojo .est{margin-top:14px;font-weight:bold;font-size:17px;opacity:1} \n  main{max-width:440px;margin:0 auto;padding:0 18px 40px} \n  .alerta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--rojo2);color:#fff;border:0; \n          border-radius:20px;padding:22px;font-size:22px;font-weight:bold;margin:-44px 0 18px;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;font-family:inherit} \n  .alerta[disabled]{background:#7a8aa0;cursor:default} \n  .card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,27,72,.08)} \n  .card h2{margin:0 0 6px;font-size:19px} \n  .it{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--d)} \n  .it:last-child{border:0;padding-bottom:0} \n  .ic{width:50px;height:50px;border-radius:50%;border:1.5px solid #C9D6EA;display:flex;align-items:center;justify-content:center;flex:none;background:#fff} \n  .it b{display:block;font-size:17px;margin-bottom:4px} \n  .it span{display:block;color:var(--t);font-size:15px;line-height:1.35} \n  .it a{display:block;color:var(--a);font-size:17px;text-decoration:none;padding:3px 0;font-weight:bold} \n  .ok{background:#DDF4EA;border-radius:14px;padding:14px;margin-bottom:14px;font-size:15px} \n  .error{background:#FFF1D6;border-radius:14px;padding:18px;margin:24px 18px} \n  .nota{text-align:center;color:var(--t);font-size:13px;margin-top:18px} \n\u003c/style> \n\u003c/head> \n\u003cbody> \n\u003cdiv id=\"app\">\u003cdiv class=\"error\">Cargando…\u003c/div>\u003c/div> \n \n\u003cscript> \n  var TOKEN = \u003c?!= JSON.stringify(token) ?>; \n  var A = null, B = null, TERMINADO = false; \n \n  function $(id){ return document.getElementById(id); } \n  function esc(s){ return String(s == null ? '' : s).replace(/[&\u003c>\"']/g, function(c){ return {'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]; }); } \n  function fmtTel(t){ return String(t).replace(/^(\\d{2})(\\d{3})(\\d{3})(\\d{3})$/, '+$1 $2 $3 $4').replace(/^(\\d+)$/, '+$1'); } \n \n  function fallo(e){ \n    if (TERMINADO) return; \n    TERMINADO = true; \n    $('app').innerHTML = '\u003cdiv class=\"error\">\u003cb>No se pudo mostrar la ficha\u003c/b>\u003cbr>' + esc((e && e.message) || 'Pulsera no válida.') + '\u003c/div>'; \n  } \n \n  function listo(){ if (A && B && !TERMINADO){ TERMINADO = true; pintar(); } } \n \n  // Las dos consultas salen a la vez para que cargue más rápido \n  google.script.run.withSuccessHandler(function(r){ \n    if (!r.valida){ fallo({message: 'Este código no está registrado en SafeStep.'}); return; } \n    A = r; listo(); \n  }).withFailureHandler(fallo).publicoInfo(TOKEN); \n \n  google.script.run.withSuccessHandler(function(r){ B = r; listo(); }) \n    .withFailureHandler(fallo).emergenciaInfo(TOKEN); \n \n  var ICO_P = '\u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"#001B48\">\u003ccircle cx=\"12\" cy=\"8\" r=\"4\"/>\u003cpath d=\"M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z\"/>\u003c/svg>'; \n  var ICO_M = '\u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"#001B48\">\u003cpath d=\"M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z\"/>\u003c/svg>'; \n  var ICO_A = '\u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#001B48\" stroke-width=\"2\" stroke-linecap=\"round\">\u003cpath d=\"M12 3C8 8 6 11 6 14a6 6 0 0 0 12 0c0-3-2-6-6-11z\"/>\u003c/svg>'; \n  var ICO_T = '\u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#001B48\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z\"/>\u003c/svg>'; \n \n  function llamadas(){ \n    return B.padres.map(function(p){ \n      return '\u003ca href=\"tel:+' + esc(p.tel) + '\">' + esc(p.nombre) + ' · ' + fmtTel(p.tel) + '\u003c/a>'; \n    }).join('') || '\u003cspan>Aún no hay teléfonos registrados.\u003c/span>'; \n  } \n \n  function pintar(){ \n    var edad = A.edad ? ', ' + esc(A.edad) + ' años' : ''; \n    $('app').innerHTML = \n      '\u003cdiv class=\"rojo\">\u003cdiv class=\"t\">\u003csvg width=\"46\" height=\"46\" viewBox=\"0 0 24 24\" fill=\"#fff\">\u003cpath d=\"M12 2 1 21h22L12 2Zm1 15h-2v-2h2v2Zm0-4h-2V9h2v4Z\"/>\u003c/svg>\u003ch1>Emergencia\u003c/h1>\u003c/div>' + \n      '\u003cp>Si te encuentras en una situación de peligro, presiona el botón para alertar a tus padres.\u003c/p>' + \n      '\u003cdiv class=\"est\">' + esc(B.nombre) + edad + '\u003c/div>\u003c/div>' + \n      '\u003cmain>\u003cbutton class=\"alerta\" id=\"btnAlerta\" onclick=\"enviar()\">' + \n      '\u003csvg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z\"/>\u003c/svg>Enviar alerta\u003c/button>' + \n      '\u003cdiv id=\"resp\">\u003c/div>' + \n      '\u003cdiv class=\"card\">\u003ch2>Información importante\u003c/h2>' + \n      '\u003cdiv class=\"it\">\u003cdiv class=\"ic\">' + ICO_P + '\u003c/div>\u003cdiv>\u003cb>Tus padres\u003c/b>' + llamadas() + '\u003c/div>\u003c/div>' + \n      '\u003cdiv class=\"it\">\u003cdiv class=\"ic\">' + ICO_M + '\u003c/div>\u003cdiv>\u003cb>Centro médico más cercano\u003c/b>\u003cspan>' + esc(B.hospital || 'Sin registrar') + '\u003c/span>\u003c/div>\u003c/div>' + \n      '\u003cdiv class=\"it\">\u003cdiv class=\"ic\">' + ICO_A + '\u003c/div>\u003cdiv>\u003cb>Alergias\u003c/b>\u003cspan>' + esc(A.alergias || 'Ninguna registrada') + '\u003c/span>\u003c/div>\u003c/div>' + \n      (B.emergencia ? '\u003cdiv class=\"it\">\u003cdiv class=\"ic\">' + ICO_T + '\u003c/div>\u003cdiv>\u003cb>Números de emergencia\u003c/b>\u003cspan>' + esc(B.emergencia) + '\u003c/span>\u003c/div>\u003c/div>' : '') + \n      '\u003c/div>\u003cdiv class=\"nota\">Información limitada. No necesitas instalar nada.\u003c/div>\u003c/main>'; \n  } \n \n  function enviar(){ \n    var b = $('btnAlerta'); b.disabled = true; b.textContent = 'Enviando…'; \n    google.script.run.withSuccessHandler(function(){ \n      b.textContent = 'Alerta enviada'; \n      $('resp').innerHTML = '\u003cdiv class=\"ok\">Se registró la alerta. Llama ahora a la familia:\u003cbr>' + llamadas() + '\u003c/div>'; \n    }).withFailureHandler(function(e){ \n      b.disabled = false; b.textContent = 'Enviar alerta'; \n      $('resp').innerHTML = '\u003cdiv class=\"error\" style=\"margin:0 0 14px\">' + esc(e.message) + '\u003c/div>'; \n    }).emergenciaEnviar(TOKEN); \n  } \n\u003c/script> \n\u003c/body> \n\u003c/html>\n",
  Inicio: "\u003c!DOCTYPE html> \n\u003chtml> \n\u003chead> \n\u003cbase target=\"_top\"> \n\u003cmeta charset=\"utf-8\"> \n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> \n\u003cstyle> \n  :root{--m:#001B48;--a:#02457A;--b:#018ABE;--c:#97CADB;--d:#D6E8EE;--crema:#EEE5C2;--am:#FAD564;--lima:#D3DC7C;--verde:#8EBD9D;--t:#1B475D} \n  *{box-sizing:border-box} \n  html,body{margin:0;min-height:100%} \n  body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--m);overflow-x:hidden} \n  .formas{position:absolute;top:0;left:0;width:100%;height:230px;display:block} \n  main{position:relative;max-width:420px;margin:0 auto;padding:120px 24px 40px;text-align:center} \n  .logo{width:150px;height:150px;border-radius:50%;border:5px solid #fff;box-shadow:0 6px 18px rgba(0,27,72,.25);background:var(--crema);object-fit:cover} \n  h1{margin:14px 0 4px;font-size:32px;letter-spacing:.5px} \n  h1 span{color:var(--b)} \n  .sub{margin:0 0 26px;font-size:15px;color:var(--t)} \n  .rol{display:flex;align-items:center;justify-content:space-between;text-decoration:none;background:var(--a);color:#fff; \n       border-radius:14px;padding:18px 20px;margin-bottom:14px;font-size:17px;font-weight:bold;box-shadow:0 3px 8px rgba(2,69,122,.25)} \n  .rol small{display:block;font-weight:normal;font-size:12px;color:var(--d);margin-top:3px} \n  .rol i{font-style:normal;font-size:22px;color:var(--am)} \n  .rol:active{background:var(--m)} \n  .pie{margin-top:26px;font-size:12px;color:var(--t)} \n\u003c/style> \n\u003c/head> \n\u003cbody> \n\u003csvg class=\"formas\" viewBox=\"0 0 400 230\" preserveAspectRatio=\"none\" aria-hidden=\"true\"> \n  \u003cpolygon points=\"0,0 320,0 0,210\" fill=\"#02457A\"/> \n  \u003cpolygon points=\"0,0 200,0 0,115\" fill=\"#001B48\"/> \n  \u003cpolygon points=\"320,0 400,0 400,130\" fill=\"#FAD564\"/> \n\u003c/svg> \n \n\u003cmain> \n  \u003cimg class=\"logo\" src=\"\u003c?!= incluir_('Logo') ?>\" alt=\"SafeStep\"> \n  \u003ch1>Safe\u003cspan>Step\u003c/span>\u003c/h1> \n  \u003cp class=\"sub\">Para comenzar, selecciona tu rol\u003c/p> \n \n  \u003ca class=\"rol\" href=\"\u003c?!= base ?>?page=personal\" target=\"_top\"> \n    \u003cspan>Personal del colegio\u003csmall>Registrar salidas y gestionar estudiantes\u003c/small>\u003c/span>\u003ci>&rarr;\u003c/i> \n  \u003c/a> \n  \u003ca class=\"rol\" href=\"\u003c?!= base ?>?page=entrada&rol=apoderado\" target=\"_top\"> \n    \u003cspan>Apoderado\u003csmall>Ver el historial y confirmar la llegada\u003c/small>\u003c/span>\u003ci>&rarr;\u003c/i> \n  \u003c/a> \n  \u003ca class=\"rol\" href=\"\u003c?!= base ?>?page=estudiante\" target=\"_top\"> \n    \u003cspan>Estudiante\u003csmall>Emergencia y llegada a casa\u003c/small>\u003c/span>\u003ci>&rarr;\u003c/i> \n  \u003c/a> \n \n  \u003cdiv class=\"pie\">Tu camino a casa, registrado paso a paso.\u003c/div> \n\u003c/main> \n\u003c/body> \n\u003c/html>\n",
  Entrada: "\u003c!DOCTYPE html> \n\u003chtml> \n\u003chead> \n\u003cbase target=\"_top\"> \n\u003cmeta charset=\"utf-8\"> \n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> \u003cscript src=\"https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js\">\u003c/script> \u003cstyle> \n \n:root{--m:#001B48;--a:#02457A;--b:#018ABE;--c:#97CADB;--d:#D6E8EE;--crema:#EEE5C2;--am:#FAD564;--verde:#8EBD9D;--t:#1B475D} \n  *{box-sizing:border-box} \n  [hidden]{display:none!important} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--m)} \n  .bar{display:flex;align-items:center;padding:14px 16px;background:var(--m);color:#fff} \n  .bar a{color:var(--am);text-decoration:none;font-size:30px;line-height:1;margin-right:14px} \n  .bar h1{margin:0;font-size:19px;flex:1;text-align:center;margin-right:30px} \n  main{max-width:420px;margin:0 auto;padding:26px 24px;text-align:center} \n  .marco{position:relative;width:250px;height:250px;margin:0 auto 18px;background:var(--d);border-radius:22px;overflow:hidden; \n         display:flex;align-items:center;justify-content:center} \n  .marco video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover} \n  .marco span{position:absolute;width:42px;height:42px;border:5px solid var(--m);z-index:2} \n  .marco .c1{top:8px;left:8px;border-right:0;border-bottom:0;border-radius:14px 0 0 0} \n  .marco .c2{top:8px;right:8px;border-left:0;border-bottom:0;border-radius:0 14px 0 0} \n  .marco .c3{bottom:8px;left:8px;border-right:0;border-top:0;border-radius:0 0 0 14px} \n  .marco .c4{bottom:8px;right:8px;border-left:0;border-top:0;border-radius:0 0 14px 0} \n  .ayuda{font-size:15px;color:var(--t);margin:0 0 18px} \n \nbutton,a.btn{display:block;width:100%;background:var(--a);color:#fff;border:0;border-radius:14px;padding:15px;font-size:16px; \n \nfont-weight:bold;cursor:pointer;text-decoration:none;margin-bottom:12px} \n  a.verde{background:var(--verde);color:var(--m)} \n  label{display:block;text-align:left;font-size:13px;margin:10px 0 4px;color:var(--t)} \n  input{width:100%;padding:13px;border:1.5px solid var(--c);border-radius:12px;font-size:17px;text-transform:uppercase} \n  input[type=file]{text-transform:none;font-size:15px} \n  .msg{min-height:20px;font-size:14px;margin:8px 0} \n  .caja{background:var(--d);border-radius:16px;padding:14px;margin:12px 0} \n  button.borde{background:#fff;color:var(--a);border:2px solid var(--a)} \n \n.circ{width:120px;height:120px;border-radius:50%;background:#DDF4EA;margin:6px auto 18px;display:flex;align-items:center;justify-content:center} \n  .res h1{font-size:32px;margin:0 0 8px} \n  .res h2{font-size:19px;color:#2E8B57;margin:0 0 10px} \n  .tiempos{display:flex;justify-content:space-around;margin:18px 0} \n  .tiempos small{display:block;color:var(--t);font-size:13px} \n  .tiempos b{font-size:20px} \n \n.li{display:flex;gap:12px;align-items:flex-start;text-align:left;margin:12px 4px;font-size:16px} \n\u003c/style> \n\u003c/head> \n\u003cbody> \n\u003cdiv class=\"bar\"> \n  \u003ca href=\"\u003c?!= base ?>\" target=\"_top\" aria-label=\"Volver\">&lsaquo;\u003c/a> \n  \u003ch1 id=\"tit\">Ingresar\u003c/h1> \n\u003c/div> \n \n\u003cmain> \n  \u003c!-- APODERADO: solo ID personal --> \n  \u003cdiv id=\"zonaApoderado\" hidden> \n    \u003cp class=\"ayuda\">Escribe tu ID personal para ver a tus hijos.\u003c/p> \n    \u003clabel for=\"idPers\">ID personal\u003c/label> \n    \u003cinput id=\"idPers\" maxlength=\"8\" autocapitalize=\"characters\" autocomplete=\"off\"> \n    \u003cdiv style=\"margin-top:12px\">\u003cbutton onclick=\"entrarApoderado()\">Entrar\u003c/button>\u003c/div> \n    \u003ca id=\"abrirAp\" class=\"btn verde\" hidden target=\"_top\">Abrir mi perfil\u003c/a> \n  \u003c/div> \n \n  \u003c!-- ESTUDIANTE: solo escáner de QR --> \n  \u003cdiv id=\"zonaEstudiante\" hidden> \n    \u003cdiv class=\"marco\"> \n      \u003cvideo id=\"video\" playsinline muted hidden>\u003c/video> \n      \u003csvg id=\"icono\" viewBox=\"0 0 100 100\" width=\"110\" height=\"110\" aria-hidden=\"true\"> \n        \u003cg fill=\"#001B48\"> \n          \u003crect x=\"8\" y=\"8\" width=\"26\" height=\"26\" rx=\"3\"/>\u003crect x=\"66\" y=\"8\" width=\"26\" height=\"26\" rx=\"3\"/> \n          \u003crect x=\"8\" y=\"66\" width=\"26\" height=\"26\" rx=\"3\"/>\u003crect x=\"42\" y=\"42\" width=\"16\" height=\"16\"/> \n          \u003crect x=\"66\" y=\"66\" width=\"10\" height=\"10\"/>\u003crect x=\"82\" y=\"66\" width=\"10\" height=\"26\"/> \n        \u003c/g> \n        \u003cg fill=\"#D6E8EE\">\u003crect x=\"14\" y=\"14\" width=\"14\" height=\"14\"/>\u003crect x=\"72\" y=\"14\" width=\"14\" height=\"14\"/>\u003crect x=\"14\" y=\"72\" width=\"14\" height=\"14\"/>\u003c/g> \n      \u003c/svg> \n      \u003cspan class=\"c1\">\u003c/span>\u003cspan class=\"c2\">\u003c/span>\u003cspan class=\"c3\">\u003c/span>\u003cspan class=\"c4\">\u003c/span> \n    \u003c/div> \n    \u003ccanvas id=\"lienzo\" hidden>\u003c/canvas> \n \n    \u003cp class=\"ayuda\" id=\"ayuda\">Acerca el código QR de tu pulsera a la cámara.\u003c/p> \n    \u003cbutton id=\"btnCam\" onclick=\"abrirCamara()\">Activar cámara\u003c/button> \n \n    \u003cdiv id=\"fotoBox\" class=\"caja\" hidden> \n      \u003clabel>La cámara en vivo no está disponible aquí. Toma una foto del QR:\u003c/label> \n      \u003cinput type=\"file\" id=\"foto\" accept=\"image/*\" capture=\"environment\" onchange=\"leerFoto(this)\"> \n    \u003c/div> \n \n    \u003ca id=\"abrir\" class=\"btn verde\" hidden target=\"_top\">QR leído · Continuar\u003c/a> \n \n    \u003c!-- Solo en «Llegada a casa»: por si olvidó la pulsera --> \n    \u003cdiv id=\"zonaDni\"> \n      \u003cbutton class=\"borde\" id=\"btnSinPulsera\" onclick=\"mostrarDni()\">No tengo mi pulsera\u003c/button> \n      \u003cdiv id=\"dniBox\" class=\"caja\" hidden> \n        \u003clabel for=\"dni\">Ingresa tu DNI\u003c/label> \n        \u003cinput id=\"dni\" inputmode=\"numeric\" maxlength=\"8\" autocomplete=\"off\" placeholder=\"8 dígitos\"> \n        \u003cdiv style=\"margin-top:12px\">\u003cbutton onclick=\"llegadaDni()\">Registrar mi llegada\u003c/button>\u003c/div> \n      \u003c/div> \n    \u003c/div> \n  \u003c/div> \n \n  \u003cdiv class=\"msg\" id=\"msg\">\u003c/div> \n\u003c/main> \n \n\u003cscript> \n  var BASE = \u003c?!= JSON.stringify(base) ?>; \n  var ROL = \u003c?!= JSON.stringify(rol) ?>; \n  var ACCION = \u003c?!= JSON.stringify(accion) ?>; \n  var STREAM = null, ESCANEANDO = false; \n  function $(id){ return document.getElementById(id); } \n \n  // Muestra solo lo que corresponde al rol \n  (function(){ \n    if (ROL === 'apoderado'){ \n      $('zonaApoderado').hidden = false; \n      $('zonaEstudiante').remove(); \n      $('tit').textContent = 'Ingresar'; \n    } else { \n      $('zonaEstudiante').hidden = false; \n      $('zonaApoderado').remove(); \n      $('tit').textContent = ACCION === 'llegada' ? 'Llegada a casa' : 'Emergencia'; \n      if (ACCION !== 'llegada') $('zonaDni').remove(); \n    } \n  })(); \n \n  /* ---------- Apoderado: ID personal ---------- */ \n  function entrarApoderado(){ \n    $('msg').textContent = 'Verificando…'; \n    google.script.run \n      .withSuccessHandler(function(url){ \n        $('abrirAp').href = url; $('abrirAp').hidden = false; $('msg').textContent = ''; \n      }) \n      .withFailureHandler(function(e){ $('msg').textContent = e.message; }) \n      .apoderadoEntrar($('idPers').value); \n  } \n \n  /* ---------- Estudiante: escanear QR ---------- */ \n  /* ---------- Cámara: apertura robusta y lectura de QR ---------- */ \n  var DETECTOR = null; \n  try { if ('BarcodeDetector' in window) DETECTOR = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { DETECTOR = null; } \n \n  function pedirCamara(){ \n    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ \n      return Promise.reject({ name: 'SinApi' }); \n    } \n    var intentos = [ \n      { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }, \n      { video: true, audio: false } \n    ]; \n    function probar(i){ \n      return navigator.mediaDevices.getUserMedia(intentos[i]).catch(function(e){ \n        if (i + 1 \u003c intentos.length && e && e.name !== 'NotAllowedError' && e.name !== 'SecurityError'){ return probar(i + 1); } \n        throw e; \n      }); \n    } \n    return probar(0); \n  } \n \n  function msgCamara(e){ \n    var n = (e && e.name) || ''; \n    if (n === 'SinApi') return 'Este navegador no permite usar la cámara aquí. Abre el enlace en Chrome o Safari (no desde WhatsApp ni Instagram).'; \n    if (n === 'NotAllowedError' || n === 'SecurityError') return 'La cámara está bloqueada. Toca el candado junto a la dirección, permite la cámara y vuelve a intentar.'; \n    if (n === 'NotFoundError' || n === 'DevicesNotFoundError') return 'No se encontró ninguna cámara en este dispositivo.'; \n    if (n === 'NotReadableError' || n === 'TrackStartError') return 'La cámara la está usando otra aplicación. Ciérrala e intenta de nuevo.'; \n    return 'No se pudo abrir la cámara (' + (n || 'error desconocido') + ').'; \n  } \n \n  function leerCuadro(){ \n    if (!ESCANEANDO) return; \n    var v = $('video'); \n    if (v.readyState !== v.HAVE_ENOUGH_DATA){ requestAnimationFrame(leerCuadro); return; } \n    if (DETECTOR){ \n      DETECTOR.detect(v).then(function(r){ \n        if (!ESCANEANDO) return; \n        if (r && r.length && r[0].rawValue){ procesarQR(r[0].rawValue); } \n        else { requestAnimationFrame(leerCuadro); } \n      }).catch(function(){ DETECTOR = null; requestAnimationFrame(leerCuadro); }); \n      return; \n    } \n    if (typeof jsQR === 'undefined'){ modoFoto('No se cargó el lector de QR. Revisa tu conexión a internet.'); return; } \n    var c = $('lienzo'); \n    c.width = v.videoWidth; c.height = v.videoHeight; \n    var x = c.getContext('2d'); \n    x.drawImage(v, 0, 0, c.width, c.height); \n    var q = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'dontInvert' }); \n    if (q && q.data){ procesarQR(q.data); return; } \n    requestAnimationFrame(leerCuadro); \n  } \n \n  function abrirCamara(){ \n    detener(); \n    $('msg').textContent = 'Abriendo cámara…'; \n    $('btnCam').disabled = true; \n    pedirCamara() \n      .then(function(s){ \n        STREAM = s; \n        var v = $('video'); \n        v.srcObject = s; v.hidden = false; $('icono').hidden = true; \n        $('btnCam').hidden = true; $('fotoBox').hidden = true; \n        var p = v.play(); if (p && p.catch) p.catch(function(){}); \n        ESCANEANDO = true; \n        $('msg').textContent = ''; \n        requestAnimationFrame(leerCuadro); \n      }) \n      .catch(function(err){ modoFoto(msgCamara(err)); }); \n  } \n \n  function modoFoto(motivo){ \n    detener(); \n    $('video').hidden = true; $('icono').hidden = false; \n    $('btnCam').hidden = false; $('btnCam').disabled = false; $('btnCam').textContent = 'Reintentar cámara'; \n    $('fotoBox').hidden = false; \n    $('msg').textContent = motivo || ''; \n  } \n \n  function leerFoto(input){ \n    var archivo = input.files && input.files[0]; \n    if (!archivo) return; \n    var img = new Image(); \n    img.onload = function(){ \n      var esc = Math.min(1, 1200 / Math.max(img.width, img.height)); \n      var c = $('lienzo'); \n      c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc); \n      var x = c.getContext('2d'); \n      x.drawImage(img, 0, 0, c.width, c.height); \n      var q = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height); \n      input.value = ''; \n      if (q && q.data){ procesarQR(q.data); } \n      else { $('msg').textContent = 'No se pudo leer el QR. Acércate y toma otra foto.'; } \n    }; \n    img.src = URL.createObjectURL(archivo); \n  } \n \n  function detener(){ \n    ESCANEANDO = false; \n    if (STREAM){ STREAM.getTracks().forEach(function(t){ t.stop(); }); STREAM = null; } \n  } \n \n  function mostrarAbrir(url){ \n    detener(); \n    $('video').hidden = true; $('icono').hidden = false; $('fotoBox').hidden = true; $('btnCam').hidden = true; \n    $('abrir').href = url; \n    $('abrir').hidden = false; \n    $('msg').textContent = ''; \n  } \n \n  function procesarQR(texto){ \n    var m = String(texto).match(/[?&]t=([a-fA-F0-9]+)/); \n    if (!m){ detener(); $('msg').textContent = 'Este QR no es de SafeStep.'; return; } \n    // El estudiante abre su pantalla (emergencia o llegada), no la ficha pública \n    mostrarAbrir(BASE + '?t=' + m[1] + '&vista=' + ACCION); \n  } \n \n  /* ---------- Llegada a casa sin pulsera: DNI ---------- */ \n  function esc(s){ return String(s == null ? '' : s).replace(/[&\u003c>\"']/g, function(c){ return {'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]; }); } \n \n  function mostrarDni(){ \n    detener(); \n    $('btnSinPulsera').hidden = true; \n    $('dniBox').hidden = false; \n    $('dni').focus(); \n  } \n \n  function llegadaDni(){ \n    var v = $('dni').value.replace(/\\D/g, ''); \n    if (v.length \u003c 8){ $('msg').textContent = 'Escribe tu DNI de 8 dígitos.'; return; } \n    $('msg').textContent = 'Registrando…'; \n    google.script.run \n      .withSuccessHandler(exitoDni) \n      .withFailureHandler(function(e){ $('msg').textContent = e.message; }) \n      .estudianteLlegadaPorDNI(v); \n  } \n \n  function exitoDni(r){ \n    var ok = '\u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#001B48\" stroke-width=\"2\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8 12 3 3 5-6\"/>\u003c/svg>'; \n    var bell = '\u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#001B48\" stroke-width=\"2\">\u003cpath d=\"M6 17V11a6 6 0 0 1 12 0v6l2 2H4l2-2ZM10 21h4\"/>\u003c/svg>'; \n    document.querySelector('main').innerHTML = \n      '\u003cdiv class=\"res\">\u003cdiv class=\"circ\">\u003csvg width=\"60\" height=\"60\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E8B57\" stroke-width=\"2.2\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8 12 3 3 5-6\"/>\u003c/svg>\u003c/div>' + \n      '\u003ch1>¡Muy bien!\u003c/h1>\u003ch2>Llegaste a casa, ' + esc(String(r.nombre).split(' ')[0]) + '\u003c/h2>' + \n      '\u003cp>Has completado tu recorrido de hoy.\u003c/p>\u003c/div>' + \n      '\u003cdiv class=\"tiempos\">\u003cdiv>\u003csmall>Salida\u003c/small>\u003cb>' + esc(r.salida) + '\u003c/b>\u003c/div>\u003cdiv>\u003csmall>Llegada\u003c/small>\u003cb>' + esc(r.llegada) + '\u003c/b>\u003c/div>\u003cdiv>\u003csmall>Duración\u003c/small>\u003cb>' + r.minutos + ' min\u003c/b>\u003c/div>\u003c/div>' + \n      '\u003cdiv class=\"li\">' + ok + '\u003cspan>Llegada registrada con tu DNI\u003c/span>\u003c/div>' + \n      '\u003cdiv class=\"li\">' + bell + '\u003cspan>Se ha enviado una notificación a tu familia.\u003c/span>\u003c/div>' + \n      '\u003cp style=\"font-size:14px;color:#1B475D\">Tu familia confirmará tu llegada.\u003c/p>' + \n      '\u003ca class=\"btn\" href=\"' + esc(BASE) + '?page=estudiante\" target=\"_top\" style=\"margin-top:20px\">Volver al inicio\u003c/a>'; \n  } \n\u003c/script> \n\u003c/body> \n\u003c/html>\n",
  Apoderado: "\u003c!DOCTYPE html> \n\u003chtml> \n\u003chead> \n\u003cbase target=\"_top\"> \n\u003cmeta charset=\"utf-8\"> \n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> \n\u003clink href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Caveat:wght@600&display=swap\" rel=\"stylesheet\"> \n\u003cstyle> \n  :root{--m:#243B63;--a:#243B63;--c:#C9D6EA;--d:#DCE6F5;--fondo:#FAF6EE;--am:#E8C373;--oro:#F6E7BD;--verde:#4F8A63;--t:#4A5B78;--vino:#7B3C47} \n  *{box-sizing:border-box} \n  [hidden]{display:none!important} \n  body{margin:0;font-family:'Outfit','Trebuchet MS',Arial,sans-serif;background:var(--fondo);color:var(--m)} \n  .bar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--m);color:#fff;min-height:56px} \n  .bar button{background:none;border:0;color:var(--am);font-size:30px;line-height:1;padding:0 6px;cursor:pointer;margin:0;width:auto} \n  .bar h1{margin:0;font-size:19px;font-weight:600} \n  main{max-width:480px;margin:0 auto;padding:22px 18px 40px} \n \n  /* Cabecera del perfil */ \n  .cab{background:var(--m);color:#fff;padding:22px 20px 50px} \n  .cab .in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:14px} \n  .av{width:62px;height:62px;border-radius:50%;background:var(--am);color:var(--m);font-size:28px;font-weight:700; \n      display:flex;align-items:center;justify-content:center;flex:none} \n  .hola{flex:1;min-width:0} \n  .hola b{display:block;font-size:21px;font-weight:600;line-height:1.2} \n  .hola span{display:block;font-size:15px;opacity:.85;margin-top:3px} \n  button.camp{position:relative;width:46px;height:46px;margin:0;padding:0;background:rgba(255,255,255,.13);border-radius:50%; \n              display:flex;align-items:center;justify-content:center;flex:none} \n  .camp i{position:absolute;top:9px;right:11px;width:10px;height:10px;border-radius:50%;background:#D2605E;border:2px solid var(--m)} \n \n  main.sobre{margin-top:-26px;position:relative;background:var(--fondo);border-radius:28px 28px 0 0;padding-top:30px} \n  .fila,.card{position:relative;z-index:1;background:#fff;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(36,59,99,.08)} \n  .fila{display:flex;align-items:center;gap:16px;cursor:pointer} \n  .fila div.tx{flex:1} \n  .fila b{font-size:18px;font-weight:600;display:block} \n  .fila span{display:block;color:var(--t);font-size:15px;margin-top:3px} \n  .fila i{font-style:normal;font-size:28px;color:var(--m)} \n  .ico{width:60px;height:60px;border-radius:50%;background:var(--d);display:flex;align-items:center;justify-content:center;flex:none} \n  .ico.o{background:var(--oro)} \n  .fila:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--am);outline-offset:2px} \n \n  .ilus{display:flex;align-items:center;gap:6px;margin-top:30px;margin-bottom:70px} \n  .ilus svg{flex:1.4;min-width:0;height:auto;overflow:visible} \n  .dc{position:fixed;bottom:0;z-index:0;pointer-events:none;display:block;height:auto} \n  .dcl{left:0;width:clamp(64px,15vw,120px)} \n  .dcr{right:0;width:clamp(80px,18vw,150px)} \n  .lema{flex:1;text-align:center;font-family:'Caveat','Segoe Print','Bradley Hand',cursive;font-size:27px;line-height:1.1;color:var(--m)} \n  .lema svg{display:block;margin:6px auto 0} \n  .salir{display:block;text-align:center;color:var(--t);margin-top:22px;font-size:15px} \n \n  button{display:block;width:100%;background:var(--a);color:#fff;border:0;border-radius:999px;padding:14px;font-size:16px; \n         font-family:inherit;font-weight:600;cursor:pointer;margin-top:10px} \n  button.borde{background:#fff;color:var(--a);border:2px solid var(--a)} \n  button.verde{background:var(--verde)} \n  label{display:block;font-size:14px;margin:12px 0 4px;color:var(--t)} \n  input[type=text],input[type=tel],textarea{width:100%;padding:12px;border:1.5px solid var(--c);border-radius:14px;font-size:16px;font-family:inherit;color:var(--m)} \n  .chip{display:inline-block;font-size:13px;padding:3px 10px;border-radius:10px;background:var(--d);margin-top:6px} \n  .chip.a{background:#FFF1D6}.chip.v{background:#DDF4EA} \n  .ph{background:var(--d);border-radius:16px;min-height:110px;display:flex;align-items:center;justify-content:center; \n      color:var(--t);font-size:14px;overflow:hidden;margin:8px 0} \n  .ph img{width:100%;display:block} \n  .seg{display:flex;background:#EAE4D6;border-radius:999px;padding:4px;margin-bottom:14px} \n  .seg button{margin:0;flex:1;background:none;color:var(--t);padding:10px;font-weight:500;border-radius:999px} \n  .seg button.on{background:var(--m);color:#fff;font-weight:600} \n  .dia{font-size:14px;font-weight:600;margin:18px 0 6px} \n  .rec{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 6px rgba(36,59,99,.06)} \n  .rec .g{display:flex;align-items:center;gap:10px} \n  .rec .g>div:nth-child(1),.rec .g>div:nth-child(2){flex:1} \n  .rec small{display:block;color:var(--t);font-size:13px} \n  .rec b{font-size:16px} \n  .hijo{margin-bottom:6px;font-weight:600} \n  .min{font-size:14px;color:var(--t)} \n  .ic{width:28px;height:28px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none} \n  .ic.v{background:var(--verde)}.ic.a{background:#E0A526} \n  .msg{min-height:20px;font-size:14px;margin:10px 0;color:var(--t)} \n  @media print{.bar,.cab,button,input[type=file],.noprint,.salir{display:none!important}body{background:#fff}} \n\u003c/style> \n\u003c/head> \n\u003cbody> \n\u003cdiv class=\"bar\" id=\"bar\">\u003cbutton id=\"atras\" aria-label=\"Volver\" hidden>&lsaquo;\u003c/button>\u003ch1 id=\"tit\">Mi perfil\u003c/h1>\u003c/div> \n\u003cdiv id=\"cab\">\u003c/div> \n\u003cmain id=\"main\">Cargando…\u003c/main> \n \n\u003cscript> \n  var K = \u003c?!= JSON.stringify(clave) ?>; \n  var BASE = \u003c?!= JSON.stringify(base) ?>; \n  var Z = 'America/Lima'; \n  var P = null, HIST = null, FILTRO = 'todos'; \n  var ESTADOS = {en_camino:'En camino', llegada_declarada:'Llegó · falta confirmar', verificada:'Llegada confirmada'}; \n  var ICO_H = '\u003csvg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"#243B63\" stroke=\"#243B63\" stroke-width=\"1.5\">\u003ccircle cx=\"12\" cy=\"8\" r=\"4\"/>\u003cpath d=\"M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z\"/>\u003c/svg>'; \n  var ICO_R = '\u003csvg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#243B63\" stroke-width=\"2\" stroke-linecap=\"round\">\u003ccircle cx=\"12\" cy=\"13.5\" r=\"7.5\"/>\u003cpath d=\"M12 9.5v4l2.5 1.5M9.5 3h5M12 3v3\"/>\u003c/svg>'; \n  var ICO_B = '\u003csvg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M6 17h12l-1.5-2V10a4.5 4.5 0 0 0-9 0v5zM10 20a2 2 0 0 0 4 0\"/>\u003c/svg>'; \n \n  function $(id){ return document.getElementById(id); } \n  function esc(s){ return String(s == null ? '' : s).replace(/[&\u003c>\"']/g, function(c){ return {'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]; }); } \n  function err(e){ var m = $('msg'); if (m) m.textContent = (e && e.message) || 'Ocurrió un error.'; } \n  function run(fn, args, ok){ var r = google.script.run.withSuccessHandler(ok).withFailureHandler(err); r[fn].apply(r, args); } \n \n  // cab: HTML de la cabecera grande (solo la usa «Mi perfil»); si se da, se oculta la barra simple \n  function pantalla(titulo, atras, html, cab){ \n    $('tit').textContent = titulo; \n    var b = $('atras'); \n    b.hidden = !atras; \n    if (atras) b.setAttribute('onclick', atras); \n    $('bar').hidden = !!cab; \n    $('cab').innerHTML = cab || ''; \n    $('main').className = cab ? 'sobre' : ''; \n    $('main').innerHTML = html + '\u003cdiv class=\"msg\" id=\"msg\">\u003c/div>'; \n    window.scrollTo(0, 0); \n  } \n \n  /* ---------- Mi perfil ---------- */ \n  function inicio(){ \n
