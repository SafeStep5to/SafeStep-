pantalla('Mi perfil', null, '\u003cp>Cargando…\u003c/p>'); \n    run('apoderadoPerfil', [K], function(r){ P = r; vPerfil(); }); \n  } \n \n  function fila(fn, ico, t, s, cls){ \n    return '\u003cdiv class=\"fila\" role=\"button\" tabindex=\"0\" onclick=\"' + fn + '\" onkeydown=\"if(event.key===\\'Enter\\')' + fn + '\">' + \n           '\u003cdiv class=\"ico ' + (cls || '') + '\">' + ico + '\u003c/div>\u003cdiv class=\"tx\">\u003cb>' + t + '\u003c/b>\u003cspan>' + s + '\u003c/span>\u003c/div>\u003ci>&rsaquo;\u003c/i>\u003c/div>'; \n  } \n \n  var ILUS = '\u003cdiv class=\"ilus\" aria-hidden=\"true\">' + \n    '\u003csvg viewBox=\"0 10 250 190\">' + \n      '\u003cpath d=\"M125 102C150 116 160 124 134 136 108 148 140 164 120 180 114 186 110 190\" fill=\"none\" stroke=\"#EEDDA6\" stroke-width=\"13\" stroke-linecap=\"round\"/>' + \n      '\u003cellipse cx=\"28\" cy=\"72\" rx=\"14\" ry=\"16\" fill=\"#5A9A6E\"/>\u003cpath d=\"M28 86V106M28 94l-6-5\" stroke=\"#243B63\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>' + \n      '\u003cellipse cx=\"52\" cy=\"88\" rx=\"11\" ry=\"13\" fill=\"#4F8A63\"/>\u003cpath d=\"M52 100V116\" stroke=\"#243B63\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>' + \n      '\u003cellipse cx=\"196\" cy=\"80\" rx=\"9\" ry=\"13\" fill=\"#4F8A63\"/>\u003cpath d=\"M196 93V116M196 104l5-5\" stroke=\"#243B63\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>' + \n      '\u003crect x=\"68\" y=\"70\" width=\"40\" height=\"32\" fill=\"#EFE6CE\"/>\u003cpath d=\"M64 70L88 42l24 28z\" fill=\"#243B63\"/>' + \n      '\u003crect x=\"72\" y=\"76\" width=\"7\" height=\"7\" fill=\"#E8C373\"/>\u003crect x=\"97\" y=\"76\" width=\"7\" height=\"7\" fill=\"#E8C373\"/>\u003crect x=\"82\" y=\"84\" width=\"9\" height=\"18\" fill=\"#C7B99A\"/>' + \n      '\u003crect x=\"108\" y=\"82\" width=\"34\" height=\"20\" fill=\"#EBCB82\"/>\u003cpath d=\"M104 83L125 70l20 13z\" fill=\"#2E4670\"/>' + \n      '\u003crect x=\"114\" y=\"88\" width=\"6\" height=\"7\" fill=\"#243B63\"/>\u003crect x=\"128\" y=\"88\" width=\"6\" height=\"7\" fill=\"#243B63\"/>' + \n      '\u003cpath d=\"M88 42V22\" stroke=\"#243B63\" stroke-width=\"2\"/>\u003cpath d=\"M88 22l14 4-14 4z\" fill=\"#E8A84C\"/>' + \n      '\u003cpath d=\"M118 60c4-4-4-7 0-11s3-4 3-6\" fill=\"none\" stroke=\"#D8D2C4\" stroke-width=\"2\" stroke-linecap=\"round\"/>' + \n      '\u003cpath d=\"M172 28a11 11 0 0 1 11 11c0 9-11 22-11 22s-11-13-11-22a11 11 0 0 1 11-11z\" fill=\"#243B63\"/>\u003ccircle cx=\"172\" cy=\"39\" r=\"4\" fill=\"#FAF6EE\"/>' + \n      '\u003cpath d=\"M170 66C168 76 150 74 144 80\" fill=\"none\" stroke=\"#243B63\" stroke-width=\"2\" stroke-dasharray=\"1 5\" stroke-linecap=\"round\"/>' + \n    '\u003c/svg>' + \n    '\u003cdiv class=\"lema\">Juntos por\u003cbr>su seguridad' + \n      '\u003csvg width=\"24\" height=\"22\" viewBox=\"0 0 24 22\" fill=\"none\" stroke=\"#243B63\" stroke-width=\"2\" stroke-linejoin=\"round\">\u003cpath d=\"M12 20S2 13.5 2 7.5A5 5 0 0 1 12 5a5 5 0 0 1 10 2.5C22 13.5 12 20 12 20z\"/>\u003c/svg>' + \n    '\u003c/div>\u003c/div>'; \n \n  var DECO = '\u003csvg class=\"dc dcl\" viewBox=\"0 0 40 60\" aria-hidden=\"true\">\u003cpath d=\"M0 14C0 6 8 2 16 6 28 12 38 36 36 60H0Z\" fill=\"#EBCB82\"/>\u003c/svg>' + \n    '\u003csvg class=\"dc dcr\" viewBox=\"0 0 60 60\" aria-hidden=\"true\">\u003ccircle cx=\"42\" cy=\"48\" r=\"26\" fill=\"#4F8A63\"/>\u003ccircle cx=\"56\" cy=\"56\" r=\"22\" fill=\"#243B63\"/>\u003c/svg>'; \n \n  function vPerfil(){ \n    var n = String(P.nombre || ''); \n    var saludo = /^Apoderado de /i.test(n) ? 'familia de ' + n.replace(/^Apoderado de /i, '') : n; \n    if (!saludo) saludo = 'apoderado'; \n    var ini = (n.charAt(0) || 'A').toUpperCase(); \n    var pend = P.hijos.some(function(h){ return h.estado === 'en_camino' || h.estado === 'llegada_declarada'; }); \n    var cab = '\u003cdiv class=\"cab\">\u003cdiv class=\"in\">\u003cdiv class=\"av\">' + esc(ini) + '\u003c/div>' + \n      '\u003cdiv class=\"hola\">\u003cb>Hola, ' + esc(saludo) + '\u003c/b>\u003cspan>Apoderado\u003c/span>\u003c/div>' + \n      '\u003cbutton class=\"camp\" onclick=\"vHijos()\" aria-label=\"' + (pend ? 'Avisos: hay un recorrido pendiente' : 'Avisos') + '\">' + ICO_B + (pend ? '\u003ci>\u003c/i>' : '') + '\u003c/button>\u003c/div>\u003c/div>'; \n    pantalla('Mi perfil', null, \n      fila('vHijos()', ICO_H, 'Mis hijos', 'Ver información de tus hijos', '') + \n      fila('vHist()', ICO_R, 'Historial de recorridos', 'Revisa los últimos recorridos', 'o') + \n      ILUS + DECO + \n      '\u003ca class=\"salir\" href=\"' + esc(BASE) + '\" target=\"_top\">Salir\u003c/a>', cab); \n  } \n \n  /* ---------- Mis hijos ---------- */ \n  function vHijos(){ \n    var h = P.hijos.map(function(x){ \n      var pend = x.estado === 'en_camino' || x.estado === 'llegada_declarada'; \n      return '\u003cdiv class=\"card\">\u003cb>' + esc((x.nombre + ' ' + x.apellidos).trim()) + '\u003c/b>\u003cbr>' + \n             '\u003cspan class=\"chip ' + (pend ? 'a' : (x.estado === 'verificada' ? 'v' : '')) + '\">' + esc(ESTADOS[x.estado] || 'Sin recorridos') + '\u003c/span>' + \n             '\u003cbutton onclick=\"vFicha(\\'' + x.id + '\\')\">Ficha general de emergencia\u003c/button>' + \n             (pend ? '\u003cbutton class=\"verde\" onclick=\"confirmar(\\'' + x.id + '\\')\">Confirmar llegada\u003c/button>' : '') + '\u003c/div>'; \n    }).join('') || '\u003cp>Aún no tienes hijos vinculados. Pide al colegio que los vincule a tu cuenta.\u003c/p>'; \n    pantalla('Mis hijos', 'vPerfil()', h); \n  } \n \n  function confirmar(id){ \n    if (!confirm('Confirma solo si un adulto de confianza verificó que llegó a casa.')) return; \n    run('apoderadoConfirmar', [K, id], function(){ \n      run('apoderadoPerfil', [K], function(r){ P = r; vHijos(); }); \n    }); \n  } \n \n  /* ---------- Ficha editable ---------- */ \n  function bloqueFoto(id, c, titulo, hay){ \n    return '\u003cdiv class=\"card\">\u003cb>' + titulo + '\u003c/b>\u003cdiv class=\"ph\" id=\"ph_' + c + '\">' + (hay ? 'Cargando…' : 'Aún sin foto') + '\u003c/div>' + \n           '\u003cinput class=\"noprint\" type=\"file\" accept=\"image/*\" onchange=\"subir(\\'' + id + '\\',\\'' + c + '\\',this)\">\u003c/div>'; \n  } \n \n  function vFicha(id){ \n    pantalla('Ficha de emergencia', 'vHijos()', '\u003cp>Cargando…\u003c/p>'); \n    run('apoderadoFicha', [K, id], function(f){ \n      pantalla('Ficha de emergencia', 'vHijos()', \n        '\u003cdiv class=\"card\">\u003clabel for=\"fn\">Nombres\u003c/label>\u003cinput type=\"text\" id=\"fn\" value=\"' + esc(f.nombre) + '\">' + \n        '\u003clabel for=\"fa\">Apellidos\u003c/label>\u003cinput type=\"text\" id=\"fa\" value=\"' + esc(f.apellidos) + '\">' + \n        '\u003clabel for=\"fd\">DNI\u003c/label>\u003cinput type=\"tel\" id=\"fd\" maxlength=\"12\" value=\"' + esc(f.dni) + '\">' + \n        '\u003clabel for=\"fe\">Descripción breve del estudiante\u003c/label>\u003ctextarea id=\"fe\" rows=\"4\" maxlength=\"500\">' + esc(f.descripcion) + '\u003c/textarea>' + \n        '\u003cbutton onclick=\"guardar(\\'' + id + '\\')\">Guardar cambios\u003c/button>\u003c/div>' + \n        bloqueFoto(id, 'foto', 'Fotografía del estudiante', f.foto) + \n        bloqueFoto(id, 'dni_frente', 'DNI (frente)', f.dni_frente) + \n        bloqueFoto(id, 'dni_dorso', 'DNI (dorso)', f.dni_dorso) + \n        '\u003cbutton class=\"borde\" onclick=\"window.print()\">Imprimir o guardar como PDF\u003c/button>'); \n      ['foto', 'dni_frente', 'dni_dorso'].forEach(function(c){ if (f[c]) verFoto(id, c); }); \n    }); \n  } \n \n  function guardar(id){ \n    $('msg').textContent = 'Guardando…'; \n    run('apoderadoGuardarFicha', [K, id, {nombre:$('fn').value, apellidos:$('fa').value, dni:$('fd').value, descripcion:$('fe').value}], \n      function(){ $('msg').textContent = 'Cambios guardados.'; }); \n  } \n \n  function verFoto(id, c){ \n    run('apoderadoVerFoto', [K, id, c], function(u){ \n      var el = $('ph_' + c); \n      if (el) el.innerHTML = u ? '\u003cimg alt=\"\" src=\"' + u + '\">' : 'Aún sin foto'; \n    }); \n  } \n \n  function reducir(file, cb){ \n    var img = new Image(); \n    img.onload = function(){ \n      var s = Math.min(1, 1100 / Math.max(img.width, img.height)); \n      var c = document.createElement('canvas'); \n      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); \n      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); \n      cb(c.toDataURL('image/jpeg', 0.8)); \n    }; \n    img.src = URL.createObjectURL(file); \n  } \n \n  function subir(id, c, inp){ \n    var f = inp.files && inp.files[0]; \n    if (!f) return; \n    $('ph_' + c).textContent = 'Subiendo…'; \n    reducir(f, function(d){ run('apoderadoSubirFoto', [K, id, c, d], function(){ verFoto(id, c); }); }); \n    inp.value = ''; \n  } \n \n  /* ---------- Historial de recorridos ---------- */ \n  function dia(ms){ return new Date(ms).toLocaleDateString('en-CA', {timeZone:Z}); } \n  function hora(ms){ return new Date(ms).toLocaleTimeString('es-PE', {hour:'numeric', minute:'2-digit', hour12:true, timeZone:Z}); } \n  function etiqueta(ms){ \n    var k = dia(ms); \n    var dm = new Date(ms).toLocaleDateString('es-PE', {day:'numeric', month:'short', timeZone:Z}).replace(/\\./g, '') + '.'; \n    if (k === dia(HIST.ahora)) return 'Hoy, ' + dm; \n    if (k === dia(HIST.ahora - 864e5)) return 'Ayer, ' + dm; \n    var w = new Date(ms).toLocaleDateString('es-PE', {weekday:'short', timeZone:Z}).replace(/\\./g, ''); \n    return w.charAt(0).toUpperCase() + w.slice(1) + ', ' + dm; \n  } \n \n  function vHist(){ \n    pantalla('Historial de recorridos', 'vPerfil()', '\u003cp>Cargando…\u003c/p>'); \n    run('apoderadoHistorial', [K], function(r){ HIST = r; pintaHist(); }); \n  } \n \n  function pintaHist(){ \n    var dias = FILTRO === 'semana' ? 7 : (FILTRO === 'mes' ? 30 : 36500); \n    var desde = HIST.ahora - dias * 864e5; \n    var nombres = {todos:'Todos', semana:'Semana', mes:'Mes'}; \n    var h = '\u003cdiv class=\"seg\">' + ['todos', 'semana', 'mes'].map(function(f){ \n      return '\u003cbutton class=\"' + (f === FILTRO ? 'on' : '') + '\" onclick=\"FILTRO=\\'' + f + '\\';pintaHist()\">' + nombres[f] + '\u003c/button>'; \n    }).join('') + '\u003c/div>'; \n    var lista = HIST.trayectos.filter(function(t){ return t.salida_ms >= desde; }); \n    if (!lista.length) h += '\u003cp>No hay recorridos en este período.\u003c/p>'; \n    var ult = ''; \n    lista.forEach(function(t){ \n      var k = dia(t.salida_ms); \n      if (k !== ult){ h += '\u003cdiv class=\"dia\">' + esc(etiqueta(t.salida_ms)) + '\u003c/div>'; ult = k; } \n      var min = t.llegada_ms ? Math.max(0, Math.round((t.llegada_ms - t.salida_ms) / 60000)) : null; \n      h += '\u003cdiv class=\"rec\">' + (HIST.multiples ? '\u003cdiv class=\"hijo\">' + esc(t.hijo) + '\u003c/div>' : '') + \n           '\u003cdiv class=\"g\">\u003cdiv>\u003csmall>Salida\u003c/small>\u003cb>' + esc(hora(t.salida_ms)) + '\u003c/b>\u003c/div>' + \n           '\u003cdiv>\u003csmall>Llegada\u003c/small>\u003cb>' + (t.llegada_ms ? esc(hora(t.llegada_ms)) : '—') + '\u003c/b>\u003c/div>' + \n           '\u003cdiv class=\"min\">' + (min != null ? min + ' min' : '') + '\u003c/div>' + \n           '\u003cdiv class=\"ic ' + (t.verificada ? 'v' : 'a') + '\" title=\"' + esc(ESTADOS[t.estado] || '') + '\">' + (t.verificada ? '&#10003;' : '&hellip;') + '\u003c/div>\u003c/div>\u003c/div>'; \n    }); \n    pantalla('Historial de recorridos', 'vPerfil()', h); \n  } \n \n  inicio(); \n\u003c/script> \n\u003c/body> \n\u003c/html>\n",
  Estudiante: "\u003c!DOCTYPE html> \n\u003chtml> \n\u003chead> \n\u003cbase target=\"_top\"> \n\u003cmeta charset=\"utf-8\"> \n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> \u003cstyle> \n \n:root{--m:#001B48;--a:#02457A;--b:#018ABE;--c:#97CADB;--d:#D6E8EE;--fondo:#F7F3E4;--am:#FAD564;--verde:#2E8B57;--t:#1B475D;--rojo:#8B3340;--rojo2:#E0606E} \n  *{box-sizing:border-box} \n  [hidden]{display:none!important} \n \nbody{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--m);min-height:100vh} \n  .bar{display:flex;align-items:center;padding:14px 16px;background:var(--m);color:#fff} \n  .bar a{color:var(--am);text-decoration:none;font-size:30px;line-height:1;margin-right:14px} \n  .bar h1{margin:0;font-size:19px;flex:1;text-align:center;margin-right:30px} \n  main{max-width:440px;margin:0 auto;padding:22px 18px 40px} \n \n.op{display:flex;align-items:center;gap:16px;text-decoration:none;color:#fff;border-radius:20px;padding:24px 20px;margin-bottom:16px;box-shadow:0 3px 8px rgba(0,27,72,.18)} \n  .op.r{background:var(--rojo)}.op.l{background:var(--a)} \n  .op b{font-size:21px;display:block} \n  .op span{font-size:14px;opacity:.9;display:block;margin-top:4px} \n  .op i{font-style:normal;font-size:28px;margin-left:auto;color:var(--am)} \n \n.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,27,72,.08)} \n  .card h2{margin:0 0 12px;font-size:18px} \n  .it b{display:block} \n  .it a.tel{display:block;color:var(--a);font-size:17px;text-decoration:none;padding:6px 0} \n  .it small{color:var(--t)} \n  .it{padding:12px 0;border-bottom:1px solid var(--d)}.it:last-child{border:0} \n  /* Emergencia */ \n  .rojo{background:var(--rojo);color:#fff;margin:-22px -18px 0;padding:26px 20px 70px;text-align:center} \n  .rojo h1{margin:8px 0;font-size:28px} \n  .rojo p{margin:0;font-size:16px;line-height:1.4;opacity:.95} \n \n.alerta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;background:var(--rojo2);color:#fff;border:0; \n \nborder-radius:20px;padding:22px;font-size:22px;font-weight:bold;margin:-40px 0 18px;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer} \n  .alerta[disabled]{background:#7a8aa0} \n \n.ok{background:#DDF4EA;border-radius:14px;padding:14px;margin-bottom:14px;font-size:15px} \n  /* Llegada */ \n \n.logo{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:bold;font-size:22px;margin:6px 0 18px} \n  .logo div{width:52px;height:52px;border-radius:14px;background:var(--a);display:flex;align-items:center;justify-content:center} \n \n.circ{width:130px;height:130px;border-radius:50%;background:#DDF4EA;margin:10px auto 22px;display:flex;align-items:center;justify-content:center} \n  .centro{text-align:center} \n  .centro h1{font-size:34px;margin:0 0 8px} \n  .centro h2{font-size:20px;color:var(--verde);margin:0 0 12px} \n \n.li{display:flex;gap:12px;align-items:flex-start;text-align:left;margin:14px 4px;font-size:17px} \n  .li svg{flex:none;margin-top:2px} \n  .tiempos{display:flex;justify-content:space-around;margin:18px 0} \n  .tiempos small{display:block;color:var(--t);font-size:13px} \n  .tiempos b{font-size:20px} .error{background:#FFF1D6;border-radius:14px;padding:16px;margin-top:14px} \u003c/style> \n\u003c/head> \n\u003cbody> \n\u003c? if (vista === 'menu' && !/^DNI/.test(clave)) { ?> \n  \u003cdiv class=\"bar\">\u003ca href=\"\u003c?!= base ?>\" target=\"_top\" aria-label=\"Volver\">&lsaquo;\u003c/a>\u003ch1>Estudiante\u003c/h1>\u003c/div> \n  \u003cmain> \n    \u003ca class=\"op r\" href=\"\u003c?!= base ?>?page=entrada&rol=estudiante&accion=emergencia\" target=\"_top\"> \n      \u003cdiv>\u003cb>Emergencia\u003c/b>\u003cspan>Avisa a tus padres si estás en peligro\u003c/span>\u003c/div>\u003ci>&rsaquo;\u003c/i> \n    \u003c/a> \n    \u003ca class=\"op l\" href=\"\u003c?!= base ?>?page=entrada&rol=estudiante&accion=llegada\" target=\"_top\"> \n      \u003cdiv>\u003cb>Llegada a casa\u003c/b>\u003cspan>Escanea tu QR para terminar tu recorrido\u003c/span>\u003c/div>\u003ci>&rsaquo;\u003c/i> \n    \u003c/a> \n    \u003cp style=\"text-align:center;margin-top:20px;font-size:15px;color:var(--t)\"> \n      ¿Sin tu pulsera?\u003cbr> \n      \u003ca href=\"\u003c?!= base ?>?page=estudiante&k=DNIEMER\" target=\"_top\" style=\"color:var(--a)\">Emergencia con DNI\u003c/a> · \n      \u003ca href=\"\u003c?!= base ?>?page=estudiante&k=DNILLEG\" target=\"_top\" style=\"color:var(--a)\">Llegada con DNI\u003c/a> \n    \u003c/p> \n  \u003c/main> \n\u003c? } else { ?> \n  \u003cmain id=\"app\">\u003cp>Cargando…\u003c/p>\u003c/main> \n  \u003cscript> \n    var TOKEN = \u003c?!= JSON.stringify(token) ?>; \n    var VISTA = \u003c?!= JSON.stringify(vista === 'menu' ? (clave === 'DNILLEG' ? 'dni_llegada' : 'dni_emergencia') : vista) ?>; \n    var BASE = \u003c?!= JSON.stringify(base) ?>; \n    function $(id){ return document.getElementById(id); } \n    function esc(s){ return String(s == null ? '' : s).replace(/[&\u003c>\"']/g, function(c){ return {'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]; }); } \n    function fmtTel(t){ return String(t).replace(/^(\\d{2})(\\d{3})(\\d{3})(\\d{3})$/, '+$1 $2 $3 $4').replace(/^(\\d+)$/, '+$1'); } \n    function volver(){ return '\u003ca class=\"salir\" style=\"display:block;text-align:center;margin-top:22px;color:#1B475D\" href=\"' + esc(BASE) + '?page=estudiante\" target=\"_top\">Volver al inicio\u003c/a>'; } \n    function fallo(e){ $('app').innerHTML = '\u003cdiv class=\"error\">\u003cb>No se pudo continuar\u003c/b>\u003cbr>' + esc(e.message) + '\u003c/div>' + volver(); } \n    /* ---------- Emergencia ---------- */ \n    var INFO = null; \n    function llamadas(){ \n      return INFO.padres.map(function(p){ return '\u003ca class=\"tel\" href=\"tel:+' + esc(p.tel) + '\">' + esc(p.nombre) + ' · ' + fmtTel(p.tel) + '\u003c/a>'; }).join('') \n             || '\u003csmall>Aún no hay teléfonos registrados.\u003c/small>'; \n    } \n    function emergencia(){ \n      google.script.run.withSuccessHandler(function(r){ \n        INFO = r; \n        $('app').innerHTML = \n          '\u003cdiv class=\"rojo\">\u003csvg width=\"54\" height=\"54\" viewBox=\"0 0 24 24\" fill=\"#fff\">\u003cpath d=\"M12 2 1 21h22L12 2Zm1 15h-2v-2h2v2Zm0-4h-2V9h2v4Z\"/>\u003c/svg>' + \n          '\u003ch1>Emergencia\u003c/h1>\u003cp>Si te encuentras en una situación de peligro, presiona el botón para alertar a tus padres.\u003c/p>\u003c/div>' + \n          '\u003cbutton class=\"alerta\" id=\"btnAlerta\" onclick=\"enviar()\">Enviar alerta\u003c/button>\u003cdiv id=\"resp\">\u003c/div>' + \n          '\u003cdiv class=\"card\">\u003ch2>Información importante\u003c/h2>' + \n          '\u003cdiv class=\"it\">\u003cb>Tus padres\u003c/b>' + llamadas() + '\u003c/div>' + \n          '\u003cdiv class=\"it\">\u003cb>Centro médico más cercano\u003c/b>' + esc(r.hospital || 'Sin registrar') + '\u003c/div>' + \n          (r.emergencia ? '\u003cdiv class=\"it\">\u003cb>Números de emergencia\u003c/b>' + esc(r.emergencia) + '\u003c/div>' : '') + '\u003c/div>' + volver(); \n      }).withFailureHandler(fallo).emergenciaInfoCon(TOKEN, DNI); \n    } \n    function enviar(){ \n      var b = $('btnAlerta'); b.disabled = true; b.textContent = 'Enviando…'; \n      google.script.run.withSuccessHandler(function(){ \n        b.textContent = 'Alerta enviada'; \n        $('resp').innerHTML = '\u003cdiv class=\"ok\">Se registró tu alerta. Llama ahora a tus padres:\u003cbr>' + llamadas() + '\u003c/div>'; \n      }).withFailureHandler(function(e){ b.disabled = false; b.textContent = 'Enviar alerta'; $('resp').innerHTML = '\u003cdiv class=\"error\">' + esc(e.message) + '\u003c/div>'; }) \n        .emergenciaEnviarCon(TOKEN, DNI); \n    } \n \n    /* ---------- Llegada a casa ---------- */ \n    var CHECK = '\u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#001B48\" stroke-width=\"2\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8 12 3 3 5-6\"/>\u003c/svg>'; \n    var CAMPANA = '\u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#001B48\" stroke-width=\"2\">\u003cpath d=\"M6 17V11a6 6 0 0 1 12 0v6l2 2H4l2-2ZM10 21h4\"/>\u003c/svg>'; \n    function llegada(){ \n      google.script.run.withSuccessHandler(function(r){ \n        $('app').innerHTML = \n          '\u003cdiv class=\"logo\">\u003cdiv>\u003csvg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\">\u003cpath d=\"M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6l-8-3Z\"/>\u003cpath d=\"m9 12 2 2 4-4\"/>\u003c/svg>\u003c/div>SAFESTEP\u003c/div>' + \n          '\u003cdiv class=\"centro\">\u003cdiv class=\"circ\">\u003csvg width=\"64\" height=\"64\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E8B57\" stroke-width=\"2.2\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"m8 12 3 3 5-6\"/>\u003c/svg>\u003c/div>' + \n          '\u003ch1>¡Muy bien!\u003c/h1>\u003ch2>Llegaste a casa, ' + esc(r.nombre.split(' ')[0]) + '\u003c/h2>\u003cp>Has completado tu recorrido de hoy.\u003c/p>\u003c/div>' + \n          '\u003cdiv class=\"tiempos\">\u003cdiv>\u003csmall>Salida\u003c/small>\u003cb>' + esc(r.salida) + '\u003c/b>\u003c/div>\u003cdiv>\u003csmall>Llegada\u003c/small>\u003cb>' + esc(r.llegada) + '\u003c/b>\u003c/div>\u003cdiv>\u003csmall>Duración\u003c/small>\u003cb>' + r.minutos + ' min\u003c/b>\u003c/div>\u003c/div>' + \n          '\u003cdiv class=\"li\">' + CHECK + '\u003cspan>' + (DNI ? 'Llegada registrada con tu DNI' : 'Código QR registrado correctamente') + '\u003c/span>\u003c/div>' + \n          '\u003cdiv class=\"li\">' + CAMPANA + '\u003cspan>Se ha enviado una notificación a tu familia.\u003c/span>\u003c/div>' + \n          '\u003cp class=\"centro\" style=\"font-size:14px;color:#1B475D\">Tu familia confirmará tu llegada.\u003c/p>' + volver(); \n      }).withFailureHandler(fallo).estudianteLlegadaCon(TOKEN, DNI); \n    } \n \n    /* ---------- Entrar con DNI (sin pulsera) ---------- */ \n    var DNI = ''; \n    function pedirDni(){ \n      var emer = VISTA === 'dni_emergencia'; \n      $('app').innerHTML = \n        '\u003cdiv class=\"card\">\u003ch2>' + (emer ? 'Emergencia con DNI' : 'Llegada con DNI') + '\u003c/h2>' + \n        '\u003cp style=\"margin:0 0 12px\">Escribe tu DNI de 8 dígitos.\u003c/p>' + \n        '\u003cinput id=\"dni\" inputmode=\"numeric\" maxlength=\"8\" autocomplete=\"off\" placeholder=\"DNI\" ' + \n        'style=\"width:100%;height:50px;padding:0 14px;border:1.5px solid #97CADB;border-radius:12px;font-size:20px;letter-spacing:2px\">' + \n        '\u003cbutton id=\"btnDni\" onclick=\"continuarDni()\" style=\"width:100%;margin-top:14px;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:bold;color:#fff;background:' + \n        (emer ? '#8B3340' : '#02457A') + '\">Continuar\u003c/button>' + \n        '\u003cdiv id=\"msgDni\" style=\"min-height:20px;margin-top:10px;color:#8B3340\">\u003c/div>\u003c/div>' + volver(); \n      $('dni').addEventListener('keydown', function(e){ if (e.key === 'Enter') continuarDni(); }); \n    } \n    function continuarDni(){ \n      var v = $('dni').value.replace(/\\D/g, ''); \n      if (v.length \u003c 8){ $('msgDni').textContent = 'Escribe tu DNI de 8 dígitos.'; return; } \n      DNI = v; \n      $('btnDni').disabled = true; \n      $('app').innerHTML = '\u003cp>Cargando…\u003c/p>'; \n      if (VISTA === 'dni_emergencia') emergencia(); else llegada(); \n    } \n \n    if (VISTA === 'emergencia') emergencia(); \n    else if (VISTA === 'dni_emergencia' || VISTA === 'dni_llegada') pedirDni(); \n    else llegada(); \n  \u003c/script> \n\u003c? } ?> \n\u003c/body> \n\u003c/html>\n",
  Acceso: "\u003c!DOCTYPE html> \n\u003chtml> \n\u003chead> \n\u003cbase target=\"_top\"> \n\u003cmeta charset=\"utf-8\"> \n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> \n\u003clink href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap\" rel=\"stylesheet\"> \n\u003cstyle> \n  :root{--navy:#243B63;--oro:#E3B964;--crema:#FAF6EE;--campo:#EEEAE2;--bw:clamp(150px,38vw,280px)} \n  *{box-sizing:border-box} \n  [hidden]{display:none!important} \n  html,body{margin:0} \n  body{font-family:'Outfit','Trebuchet MS',Arial,sans-serif;background:var(--crema);color:var(--navy)} \n \n  /* La pantalla ocupa toda la ventana; las formas se pegan a las esquinas */ \n  .pantalla{position:relative;width:100%;min-height:100vh;min-height:100dvh;background:var(--crema);overflow:hidden} \n  .d{position:absolute;display:block;height:auto;pointer-events:none} \n  .d1{top:0;left:0;width:var(--bw)} \n  .d2{bottom:0;left:0;width:clamp(150px,34vw,260px)} \n  .d3{bottom:0;right:0;width:clamp(170px,40vw,320px)} \n  .d4{bottom:26px;left:50%;transform:translateX(-50%);width:min(92vw,380px)} \n \n  .atras{position:absolute;top:calc(var(--bw)*.65 + 10px);left:22px;width:44px;height:44px;display:flex;align-items:center; \n         justify-content:center;color:var(--navy);text-decoration:none;border-radius:50%;z-index:2} \n  .atras:focus-visible,input:focus-visible,button:focus-visible,a.abrir:focus-visible{outline:3px solid var(--oro);outline-offset:2px} \n \n  .contenido{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:clamp(120px,19vh,190px) 28px 210px;text-align:center} \n  .marca{margin:0;font-size:54px;font-weight:700;letter-spacing:-1px;line-height:1} \n  .marca span{color:var(--oro)} \n  .lema{margin:8px 0 0;font-size:17px} \n  .pide{margin:44px 12px 30px;font-size:19px;font-weight:600;line-height:1.35} \n  label{display:block;text-align:left;font-size:15px;margin:0 0 8px 4px} \n  .campo{position:relative} \n  .campo svg{position:absolute;left:16px;top:50%;transform:translateY(-50%)} \n  input{width:100%;height:56px;padding:0 16px 0 52px;border:0;border-radius:16px;background:var(--campo);color:var(--navy); \n        font:600 19px 'Outfit','Trebuchet MS',Arial,sans-serif;letter-spacing:2px;text-transform:uppercase} \n  input::placeholder{color:#8A93A5;font-weight:400;letter-spacing:0;text-transform:none} \n  .entrar,a.abrir{position:relative;display:block;width:100%;height:60px;margin-top:24px;border:0;border-radius:999px; \n                  background:var(--navy);color:#fff;font:600 18px 'Outfit','Trebuchet MS',Arial,sans-serif; \n                  cursor:pointer;text-decoration:none;line-height:60px;text-align:center} \n  .entrar i,a.abrir i{position:absolute;right:9px;top:9px;width:42px;height:42px;border-radius:50%;background:#F0E0A8; \n                      display:flex;align-items:center;justify-content:center} \n  .entrar:disabled{opacity:.65;cursor:default} \n  .msg{min-height:22px;margin-top:14px;font-size:15px;color:#A3303A} \n\u003c/style> \n\u003c/head> \n\u003cbody> \n\u003cdiv class=\"pantalla\"> \n  \u003c!-- esquina superior izquierda --> \n  \u003csvg class=\"d d1\" viewBox=\"0 0 215 140\" aria-hidden=\"true\">\u003cpath d=\"M0 0H215C205 25 170 38 130 52 85 68 55 90 46 135 20 120 0 100 0 70Z\" fill=\"#243B63\"/>\u003c/svg> \n  \u003c!-- esquina inferior izquierda --> \n  \u003csvg class=\"d d2\" viewBox=\"0 0 150 110\" aria-hidden=\"true\"> \n    \u003cpath d=\"M0 28C14 14 38 18 48 40 54 52 60 58 70 64 40 60 16 66 0 78Z\" fill=\"#EBCB82\"/> \n    \u003cpath d=\"M0 70C30 64 66 80 96 110H0Z\" fill=\"#243B63\"/> \n  \u003c/svg> \n  \u003c!-- esquina inferior derecha --> \n  \u003csvg class=\"d d3\" viewBox=\"0 0 170 150\" aria-hidden=\"true\">\u003cpath d=\"M170 0C130 14 96 46 70 88 54 114 40 134 24 150H170Z\" fill=\"#7B3C47\"/>\u003c/svg> \n  \u003c!-- pin, camino punteado y casa --> \n  \u003csvg class=\"d d4\" viewBox=\"0 0 280 110\" aria-hidden=\"true\"> \n    \u003cg fill=\"none\" stroke=\"#243B63\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"> \n      \u003cpath d=\"M50 6a14 14 0 0 1 14 14c0 11-14 28-14 28S36 31 36 20A14 14 0 0 1 50 6z\"/> \n      \u003ccircle cx=\"50\" cy=\"20\" r=\"5\" fill=\"#243B63\" stroke=\"none\"/> \n      \u003cpath d=\"M51 58C55 86 100 98 140 88S196 80 214 72\" stroke-width=\"2.5\" stroke-dasharray=\"1 8\"/> \n      \u003cpath d=\"M203 48L230 24 257 48M211 42V70H249V42M224 70V56H236V70M242 34V26H248V38\"/> \n    \u003c/g> \n  \u003c/svg> \n \n  \u003ca class=\"atras\" href=\"\u003c?!= base ?>\" target=\"_top\" aria-label=\"Volver\"> \n    \u003csvg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#243B63\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M19 12H5M11 6l-6 6 6 6\"/>\u003c/svg> \n  \u003c/a> \n \n  \u003cdiv class=\"contenido\"> \n    \u003ch1 class=\"marca\">Safe\u003cspan>Step\u003c/span>\u003c/h1> \n    \u003cp class=\"lema\">Tu camino, más seguro\u003c/p> \n    \u003cp class=\"pide\">Ingresa tu ID personal para ver la información de tu hijo.\u003c/p> \n \n    \u003clabel for=\"idp\">ID personal\u003c/label> \n    \u003cdiv class=\"campo\"> \n      \u003csvg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#243B63\" stroke-width=\"2\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"8\" r=\"4\"/>\u003cpath d=\"M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7\"/>\u003c/svg> \n      \u003cinput id=\"idp\" maxlength=\"12\" autocapitalize=\"characters\" autocomplete=\"off\" placeholder=\"Ej. A1B2C3\"> \n    \u003c/div> \n \n    \u003cbutton id=\"btn\" class=\"entrar\" onclick=\"entrar()\">Entrar \n      \u003ci>\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#243B63\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\"/>\u003c/svg>\u003c/i> \n    \u003c/button> \n    \u003ca id=\"abrir\" class=\"abrir\" hidden target=\"_top\">Abrir mi perfil \n      \u003ci>\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#243B63\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14M13 6l6 6-6 6\"/>\u003c/svg>\u003c/i> \n    \u003c/a> \n    \u003cdiv class=\"msg\" id=\"msg\" role=\"status\">\u003c/div> \n  \u003c/div> \n\u003c/div> \n \n\u003cscript> \n  function $(id){ return document.getElementById(id); } \n  $('idp').addEventListener('keydown', function(e){ if (e.key === 'Enter') entrar(); }); \n \n  function entrar(){ \n    var v = $('idp').value.trim(); \n    if (!v){ $('msg').textContent = 'Escribe tu ID personal.'; return; } \n    $('msg').style.color = '#4A5B78'; \n    $('msg').textContent = 'Verificando…'; \n    $('btn').disabled = true; \n    google.script.run \n      .withSuccessHandler(function(url){ \n        $('msg').textContent = ''; \n        $('abrir').href = url; \n        $('abrir').hidden = false; \n        $('btn').hidden = true; \n        try { window.top.location.href = url; } catch (e) {} \n      }) \n      .withFailureHandler(function(e){ \n        $('btn').disabled = false; \n        $('msg').style.color = '#A3303A'; \n        $('msg').textContent = e.message; \n      }) \n      .apoderadoEntrar(v); \n  } \n\u003c/script> \n\u003c/body> \n\u003c/html>\n"
};

/* Conecta las pantallas con Apps Script (reemplaza a google.script.run) */
function instalarPuente(API_URL, BASE) {
  var APPS = /^https:\/\/script\.google\.com\/(?:a\/[^\/]+\/)?macros\/s\/[^\/]+\/(?:exec|dev)/;
  function reescribir(v) {
    if (typeof v === 'string') return APPS.test(v) ? v.replace(APPS, function () { return BASE; }) : v;
    if (Array.isArray(v)) return v.map(reescribir);
    if (v && typeof v === 'object') { var o = {}; Object.keys(v).forEach(function (k) { o[k] = reescribir(v[k]); }); return o; }
    return v;
  }
  function runner(ok, fail) {
    return new Proxy({}, { get: function (_, nombre) {
      if (nombre === 'withSuccessHandler') return function (f) { return runner(f, fail); };
      if (nombre === 'withFailureHandler') return function (f) { return runner(ok, f); };
      if (nombre === 'withUserObject') return function () { return runner(ok, fail); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        function error(e) {
          var er = e instanceof Error ? e : new Error(String(e));
          if (fail) fail(er); else console.error(er);
        }
        if (/PEGA_AQUI/.test(API_URL)) { error('Falta pegar el enlace de Apps Script (termina en /exec) en index.html.'); return; }
        fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: String(nombre), args: args }), redirect: 'follow' })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            if (!j.ok) throw new Error(j.error || 'Error en el servidor.');
            if (ok) ok(reescribir(j.data));
          })
          .catch(function (e) { error(e && e.message === 'Failed to fetch' ? 'No hay conexión con el servidor. Revisa tu internet.' : e); });
      };
    } });
  }
  window.google = { script: { run: runner(null, null) } };
}

/* Plantillas: misma lógica de <?!= ... ?> que usa Apps Script */
function plantilla(src, v) {
  var re = /<\?(!?=)?([\s\S]*?)\?>/g, cod = 'var __o="";', ult = 0, m;
  while ((m = re.exec(src))) {
    cod += '__o+=' + JSON.stringify(src.slice(ult, m.index)) + ';';
    if (m[1] === '!=') cod += '__o+=(' + m[2] + ');';
    else if (m[1] === '=') cod += '__o+=esc__(' + m[2] + ');';
    else cod += m[2] + '\n';
    ult = re.lastIndex;
  }
  cod += '__o+=' + JSON.stringify(src.slice(ult)) + ';return __o;';
  var esc__ = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
  var incluir_ = function (n) { return n === 'Logo' ? LOGO : ''; };
  return new Function('base', 'token', 'vista', 'rol', 'accion', 'clave', 'incluir_', 'esc__', cod)(
    v.base, v.token, v.vista, v.rol, v.accion, v.clave, incluir_, esc__);
}

(function () {
  var BASE = location.origin + location.pathname;
  var q = new URLSearchParams(location.search);
  function par(n) { return q.get(n) || ''; }
  var token = par('t').replace(/[^a-fA-F0-9]/g, '');
  var vista = (par('vista') === 'emergencia' || par('vista') === 'llegada') ? par('vista') : '';
  var v = {
    base: BASE, token: '', vista: 'menu',
    rol: par('rol') === 'apoderado' ? 'apoderado' : 'estudiante',
    accion: par('accion') === 'llegada' ? 'llegada' : 'emergencia',
    clave: par('k').replace(/[^A-Za-z0-9]/g, '').toUpperCase()
  };
  var archivo;
  if (token && vista) { archivo = 'Estudiante'; v.token = token; v.vista = vista; }
  else if (token) { archivo = 'Publica'; v.token = token; }
  else {
    var mapa = { inicio: 'Inicio', personal: 'Panel', entrada: 'Entrada', estudiante: 'Estudiante', apoderado: 'Apoderado' };
    archivo = Object.prototype.hasOwnProperty.call(mapa, par('page')) ? mapa[par('page')] : 'Inicio';
    if (par('page') === 'entrada' && par('rol') === 'apoderado') archivo = 'Acceso';
  }
  var html = plantilla(PAGINAS[archivo], v);
  var puente = '<script>(' + instalarPuente.toString() + ')(' + JSON.stringify(API_URL) + ',' + JSON.stringify(BASE) + ');<' + '/script>';
  html = html.replace('<head>', '<head>' + puente);
  document.open();
  document.write(html);
  document.close();
})();
